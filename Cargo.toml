[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2.0"
# Benchmark-only: instruction counts under valgrind, so Linux (WSL2) only. The installed
# `iai-callgrind-runner` must be exactly this version.
iai-callgrind = "=0.16.1"
# Test-only. Forking and timeouts are left out: they pull in extra crates we do not need.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Callgrind attributes costs to functions by their symbols.
[profile.bench]
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# No panicking shortcuts outside tests (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
