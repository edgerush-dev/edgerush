[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Publishing a config to the request path without a lock: readers never wait.
arc-swap = "1.9"
# TLS on the client hop, over BoringSSL (03 §3), the same library quiche will use for
# HTTP/3. Its build needs cmake, and on Windows NASM and libclang (12). Only the proxy
# crate may depend on these two.
boring = "5.2"
# The buffers an answer is read into, and the frames cut from them without a copy. Already
# in the tree through hyper and http, at the same version.
bytes = "1.12"
edgerush-config = { path = "crates/config" }
edgerush-filters = { path = "crates/filters" }
edgerush-proxy = { path = "crates/proxy" }
edgerush-router = { path = "crates/router" }
edgerush-telemetry = { path = "crates/telemetry" }
# HTTP/2 on both hops, used directly rather than through hyper (15 §3). The version is the
# one already locked under hyper; its behaviour is pinned by the probes in
# `crates/proxy/tests/h2_library.rs`, so moving it is a deliberate change of its own.
h2 = "=0.4.19"
# Types only (header map, method): the request core works on these, never on an engine's.
http = "1.5"
# The body trait the request core and the upstream exchange work on, whichever engine read
# the body. Already in the tree through hyper, at the same version.
http-body = "1.1"
# Body helpers (an empty body, either of two bodies) for the proxy crate's answers.
http-body-util = "0.1.5"
# Tokenises the head of an upstream's response. It is already under hyper, and is what
# hyper, actix and Pingora all parse heads with; what it allows is not what EdgeRush
# allows, so every head it returns is checked again here.
httparse = "1.10"
# Clients for the proxy's tests and the second oracle of its differential fuzz target: no
# longer on the data path, which is EdgeRush's own servers and client. Only the proxy crate
# may depend on these two.
hyper = { version = "1.11", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "http2"] }
# Unicode tables are left out: regex paths are matched against normalised, ASCII-only paths.
# The config model derives these traits and knows no format; formats belong to whoever
# reads or writes a file or a stream.
serde = { version = "1.0", features = ["derive"] }
# YAML for the development harness and the command-line tools only. Reading only, no
# optional extras; pure Rust with budgets against hostile input.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
# Socket options that neither std nor tokio can set before a socket is bound. Only the
# binary binds sockets; tokio and hyper-util bring the crate in anyway. "all" is where
# SO_REUSEPORT is.
socket2 = { version = "0.6.5", features = ["all"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
# Finding the line feeds of a head a vector at a time; regex brings it in already.
memchr = "2.8"
thiserror = "2.0"
# A BoringSSL connection as a tokio stream: the handshake and the records, nothing more.
tokio-boring = "5.2"
# QUIC and HTTP/3 to clients (16 §2), driven by a worker of ours: it does no I/O and keeps
# no timers. Its TLS is the `boring` above, so there is one BoringSSL in the binary. It is
# pre-1.0 and a minor release breaks, so it is pinned; moving it re-checks 16 §2 and the
# probes in `crates/proxy/tests/h3_library.rs`. Only the proxy crate may depend on it.
quiche = { version = "=0.30.0", default-features = false, features = ["boringssl-boring-crate"] }
# Only what is used; tests add the multi-thread runtime and the macros for themselves.
tokio = { version = "1.53", features = ["net", "rt", "time"] }
# Benchmark-only: instruction counts under valgrind, so Linux (WSL2) only. The installed
# `iai-callgrind-runner` must be exactly this version.
iai-callgrind = "=0.16.1"
# Test-only. Forking and timeouts are left out: they pull in extra crates we do not need.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# The whole program optimised together, in one unit. What limits a request's path is
# how much code it fetches from beyond L2, not how many instructions it runs: at
# HTTP/1.1 saturation this made the proxy 10-18% faster and its code 15% smaller, and
# closed the gap between the two upstream clients (13 §8). It costs release builds a
# minute or more; debug builds and tests are unaffected.
[profile.release]
lto = "fat"
codegen-units = 1

# Callgrind attributes costs to functions by their symbols.
[profile.bench]
debug = true

# The same for perf, which reads them out of the binary. A release build in every
# other way: debug information changes no code, so what is measured under this is
# what runs without it.
[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# No panicking shortcuts outside tests (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
