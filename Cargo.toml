[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
edgerush-config = { path = "crates/config" }
edgerush-filters = { path = "crates/filters" }
edgerush-router = { path = "crates/router" }
# Types only (header map, method): the request core works on these, never on an engine's.
http = "1.5"
# Body helpers (an empty body, either of two bodies) for the proxy crate's answers.
http-body-util = "0.1.5"
# The HTTP engine. Only the proxy crate may depend on these two.
hyper = { version = "1.11", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
# Unicode tables are left out: regex paths are matched against normalised, ASCII-only paths.
# The config model derives these traits and knows no format; formats belong to whoever
# reads or writes a file or a stream.
serde = { version = "1.0", features = ["derive"] }
# YAML for the development harness and the command-line tools only. Reading only, no
# optional extras; pure Rust with budgets against hostile input.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
thiserror = "2.0"
# Only what is used; tests add the multi-thread runtime and the macros for themselves.
tokio = { version = "1.53", features = ["net", "rt", "time"] }
# Benchmark-only: instruction counts under valgrind, so Linux (WSL2) only. The installed
# `iai-callgrind-runner` must be exactly this version.
iai-callgrind = "=0.16.1"
# Test-only. Forking and timeouts are left out: they pull in extra crates we do not need.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Callgrind attributes costs to functions by their symbols.
[profile.bench]
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# No panicking shortcuts outside tests (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
