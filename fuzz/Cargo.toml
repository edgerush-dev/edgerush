# Fuzz targets, run with cargo-fuzz on a nightly toolchain (see the repository README).
# A package of its own, outside the workspace: nothing in EdgeRush depends on it, and the
# workspace's checks on the stable toolchain never build it.
[package]
name = "edgerush-fuzz"
description = "EdgeRush fuzz targets"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
# A response head keeps the bytes it was read from, as the proxy's does.
bytes = "1.12"
edgerush-proxy = { path = "../crates/proxy", features = ["fuzzing"] }
edgerush-router = { path = "../crates/router", features = ["reference"] }
# The reading of a request's host is compared with this crate's own.
http = "1.5"
# The field lines of a head are taken from what this parser finds, as the proxy's are.
httparse = "1.10"
libfuzzer-sys = "0.4"

[[bin]]
name = "host_index"
path = "fuzz_targets/host_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalise"
path = "fuzz_targets/normalise.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_index"
path = "fuzz_targets/path_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_host"
path = "fuzz_targets/request_host.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_request"
path = "fuzz_targets/h1_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_response"
path = "fuzz_targets/h1_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_roundtrip"
path = "fuzz_targets/h1_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_differential"
path = "fuzz_targets/h1_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_fields"
path = "fuzz_targets/h1_fields.rs"
test = false
doc = false
bench = false
