# Fuzz targets, run with cargo-fuzz on a nightly toolchain (see the repository README).
# A package of its own, outside the workspace: nothing in EdgeRush depends on it, and the
# workspace's checks on the stable toolchain never build it.
[package]
name = "edgerush-fuzz"
description = "EdgeRush fuzz targets"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
# BoringSSL's own server, the oracle the ClientHello reader is held to. Already here
# through quiche, at the version the workspace uses.
boring = "5.2"
# A response head keeps the bytes it was read from, as the proxy's does.
bytes = "1.12"
# The model and compiler a harness file is read into.
edgerush-config = { path = "../crates/config" }
edgerush-filters = { path = "../crates/filters", features = ["reference"] }
edgerush-proxy = { path = "../crates/proxy", features = ["fuzzing"] }
edgerush-router = { path = "../crates/router", features = ["reference"] }
# The reading of a request's host is compared with this crate's own.
http = "1.5"
# The field lines of a head are taken from what this parser finds, as the proxy's are.
httparse = "1.10"
libfuzzer-sys = "0.4"
# The connection IDs a datagram carries are read as this crate's parser reads them, at the
# version the proxy pins.
quiche = { version = "=0.30.0", default-features = false, features = ["boringssl-boring-crate"] }
# A harness file is read as the harness reads it, at the version the workspace uses: the
# config crate knows no format, so the reading is the harness's, which `config` repeats.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }

# The proxy's quiche, patched as the workspace's is (see its Cargo.toml).
[patch.crates-io]
quiche = { path = "../vendor/quiche" }
h2 = { path = "../vendor/h2" }

[[bin]]
name = "host_index"
path = "fuzz_targets/host_index.rs"
test = false
doc = false
bench = false

