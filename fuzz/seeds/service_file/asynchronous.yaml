pod:
  listen: 0.0.0.0:7000
  address: rl-0.rl:7000
  metrics: 0.0.0.0:9090
store:
  seeds: [rl-0.rl:7000, rl-1.rl:7000]
  shards: 256
  replicas: 2
  heartbeat_ms: 100
  stop_serving_ms: 400
  silence_ms: 600
  election_jitter_ms: 200
  cycle_ms: 10
  skew_warning_ms: 250
keys:
  max_bytes: 268435456
tls:
  certificate: pod.pem
  key: /etc/secrets/pod.key
  authorities: ca.pem
  data_plane_id: spiffe://cluster.local/ns/edge/sa/edge
