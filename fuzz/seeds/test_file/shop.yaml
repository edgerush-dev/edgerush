tests:
  - name: the cart, with a canary
    request:
      listener: web
      client: 203.0.113.7
      protocol: "1.1"
      method: GET
      url: http://shop.example.com/cart/items?id=7
      headers:
        - { name: X-Debug, value: "1" }
    expect:
      route: shop
      rule: 0
      forward:
        backends:
          - { upstream: cart, weight: 9 }
          - { upstream: cart-canary, weight: 1 }
        mirrors:
          - { upstream: shadow, fraction: { numerator: 1, denominator: 10 } }
      upstream_request:
        target: /cart/items?id=7
        headers:
          - { name: X-Gateway, value: edgerush }
          - { name: X-Debug, absent: true }
          - { name: X-Forwarded-For, value: 203.0.113.7 }
          - { name: X-Request-ID, value: 00000000-0000-7000-8000-000000000000 }
  - name: search goes to search
    request: { listener: web, client: 203.0.113.7, protocol: "1.1", method: GET, url: "http://shop.example.com/search?q=x", headers: [] }
    expect:
      route: shop
      rule: 2
      forward: { backends: [{ upstream: api, weight: 1 }], mirrors: [] }
  - name: closed is sent on
    request: { listener: web, client: 203.0.113.7, protocol: "2", method: GET, url: "http://shop.example.com/closed?x=1", headers: [] }
    expect: { route: shop, rule: 1, redirect: { status: 301, location: "/open?x=1" } }
  - name: a path with no normal form is refused
    request: { listener: web, client: 203.0.113.7, protocol: "1.1", method: GET, url: "http://shop.example.com/a/%2e%2e/b", headers: [] }
    expect: { answer: bad_path }
