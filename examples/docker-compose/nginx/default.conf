# Each backend answers with its own name and what reached it, so what EdgeRush did to a
# request can be seen from the outside.
server {
    listen 80;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Not found, so a browser stops asking: answered like any other path, every reload
    # would send a second request and the page would always take the same turn.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        default_type text/plain;
        return 200 "served by          $hostname
request            $request_method $request_uri
host               $http_host
x-forwarded-for    $http_x_forwarded_for
x-forwarded-proto  $http_x_forwarded_proto
x-forwarded-host   $http_x_forwarded_host
x-request-id       $http_x_request_id
via                $http_via
";
    }
}
