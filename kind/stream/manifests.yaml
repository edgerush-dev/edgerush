# What kind/stream.sh runs: a backend Service in `shop` behind an Ingress of class `edge`;
# in `edge`, the control plane, which follows `shop` and serves the config stream, and a data
# plane that dials it. Each holds a certificate of the stream's own authority, from the
# Secrets the script makes. The data plane may only list and watch EndpointSlices in `shop`
# (09 §1); the control plane reads the cluster's IngressClasses and `shop`'s Ingresses,
# Services and Secrets, writes the status of `shop`'s Ingresses, and reads the data plane's
# Service in `edge` for the address they say: an external IP, as kind has no load balancer.
# The control plane runs as two replicas, which elect the one that writes status by a Lease
# in `edge`; both serve the stream, and the admission webhook, with a certificate of the same
# authority for edgerush-control.edge.svc. The webhook's registration is the script's, made
# once the checks that leave the Ingress out are done, as it would refuse them.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: Namespace
metadata: { name: edge }
---
# The backend: agnhost's netexec, which answers /hostname with the name of its pod.
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: AGNHOST
          args: ["netexec", "--http-port=8080"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 1 }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: { name: edge }
spec: { controller: edgerush.dev/ingress-controller }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: edgerush-control, namespace: edge }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: edgerush-control-ingressclasses }
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: edgerush-control-ingressclasses }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edgerush-control-ingressclasses }
subjects: [{ kind: ServiceAccount, name: edgerush-control, namespace: edge }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: edgerush-control, namespace: shop }
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: edgerush-control, namespace: shop }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: edgerush-control }
subjects: [{ kind: ServiceAccount, name: edgerush-control, namespace: edge }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: edgerush-control-status, namespace: edge }
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: edgerush-control-status, namespace: edge }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: edgerush-control-status }
subjects: [{ kind: ServiceAccount, name: edgerush-control, namespace: edge }]
---
# The data plane's settings, as the control plane translates for it.
apiVersion: v1
kind: ConfigMap
metadata: { name: edgerush-plane, namespace: edge }
data:
  plane.yaml: |
    ingress_class: edge
    cluster_domain: cluster.local
    ingress_hosts_fall_through: false
    ingress_https_redirect: false
    ingress_https_redirect_max_age: 30
    listeners:
      http:
        address: "0.0.0.0:8080"
        protocol: http
        proxy_protocol: off
        forwarding: { trusted_proxies: [], trusted_only_headers: [] }
        request_id: generate
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edgerush-control, namespace: edge }
spec:
  replicas: 2
  selector: { matchLabels: { app: edgerush-control } }
  template:
    metadata: { labels: { app: edgerush-control } }
    spec:
      serviceAccountName: edgerush-control
      containers:
        - name: edgerush
          image: edgerush:kind
          imagePullPolicy: Never
          args:
            - controller
            - --data-plane
            - /etc/edgerush/plane.yaml
            - --namespace
            - shop
            - --listen
            - "0.0.0.0:9443"
            - --certificate
            - /etc/edgerush/stream/tls.crt
            - --key
            - /etc/edgerush/stream/tls.key
            - --authorities
            - /etc/edgerush/stream/ca.crt
            - --status-service
            - edge/edgerush
            - --leader-lease
            - edge/edgerush-control
            - --webhook-listen
            - "0.0.0.0:8443"
            - --webhook-certificate
            - /etc/edgerush/webhook/tls.crt
            - --webhook-key
            - /etc/edgerush/webhook/tls.key
          ports:
            - { name: stream, containerPort: 9443 }
            - { name: webhook, containerPort: 8443 }
          volumeMounts:
            - { name: plane, mountPath: /etc/edgerush }
            - { name: stream, mountPath: /etc/edgerush/stream }
            - { name: webhook, mountPath: /etc/edgerush/webhook }
      volumes:
        - name: plane
          configMap: { name: edgerush-plane }
        - name: stream
          secret: { secretName: edgerush-control-stream }
        - name: webhook
          secret: { secretName: edgerush-control-webhook }
---
apiVersion: v1
kind: Service
metadata: { name: edgerush-control, namespace: edge }
spec:
  selector: { app: edgerush-control }
  ports:
    - { name: stream, port: 9443, targetPort: stream }
    - { name: webhook, port: 443, targetPort: webhook }
---
# The data plane's Service, its address an external IP of the documentation's range.
apiVersion: v1
kind: Service
metadata: { name: edgerush, namespace: edge }
spec:
  selector: { app: edgerush }
  ports: [{ name: http, port: 80, targetPort: http }]
  externalIPs: [192.0.2.10]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: edgerush, namespace: edge }
---
# The data plane's one permission: list and watch EndpointSlices, here in `shop` alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: endpointslices, namespace: shop }
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: edgerush, namespace: shop }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: endpointslices }
subjects: [{ kind: ServiceAccount, name: edgerush, namespace: edge }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: edgerush, namespace: edge }
spec:
  replicas: 1
  selector: { matchLabels: { app: edgerush } }
  template:
    metadata: { labels: { app: edgerush } }
    spec:
      serviceAccountName: edgerush
      containers:
        - name: edgerush
          image: edgerush:kind
          imagePullPolicy: Never
          args:
            - proxy
            - --control-plane
            - edgerush-control.edge.svc:9443
            - --certificate
            - /etc/edgerush/stream/tls.crt
            - --key
            - /etc/edgerush/stream/tls.key
            - --authorities
            - /etc/edgerush/stream/ca.crt
            - --workers
            - "1"
          # The pod's own addresses, which it never sends a request to (03 §6).
          env:
            - name: POD_IPS
              valueFrom: { fieldRef: { fieldPath: status.podIPs } }
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts: [{ name: stream, mountPath: /etc/edgerush/stream }]
      volumes:
        - name: stream
          secret: { secretName: edgerush-data-plane-stream }
