# How a pod's workers might share one rate-limit view (12 item 3), narrowed down to that
# alone: each worker apart, rooms with a sync, a lock a key as Redis serializes a script,
# and atomics. A package of its own, outside the workspace, as fuzz/ and bench/wsbench
# are: nothing in EdgeRush depends on it, and it is a study, not part of the gateway.
[package]
name = "sharing"
description = "Ways for a pod's workers to share rate-limit keys, side by side"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
