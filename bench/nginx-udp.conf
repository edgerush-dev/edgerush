# NGINX as the UDP proxy under test, doing what udp.yaml asks of EdgeRush: its `stream`
# module carrying datagrams at 8053 to the backend's UDP echo, a session a client address,
# and 8080 to the backend's plain port, for run.sh to see it ready by. Run by bench/run.sh
# out of a directory of its own (the -p prefix); WORKERS is filled in by the script.
worker_processes WORKERS;
worker_rlimit_nofile 65536;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    # A UDP session holds two of a worker's connections, its client's and its upstream's.
    worker_connections 32768;
}

stream {
    proxy_connect_timeout 5s;

    # EdgeRush's default balancer, `p2c`: two servers drawn, the one with fewer connections
    # (per worker, as EdgeRush counts). One server each, so it is the work of choosing.
    upstream plain {
        random two least_conn;
        server 127.0.0.1:9000;
    }

    upstream echo {
        random two least_conn;
        server 127.0.0.1:9053;
    }

    server {
        listen 127.0.0.1:8080 reuseport backlog=4096;
        proxy_timeout 3600s;
        proxy_pass plain;
    }

    # A session ended after 60 s with nothing either way, as EdgeRush's are by default;
    # without proxy_responses, which would end it after a number of answers, as EdgeRush has
    # no way to.
    server {
        listen 127.0.0.1:8053 udp reuseport;
        proxy_timeout 60s;
        proxy_pass echo;
    }
}
