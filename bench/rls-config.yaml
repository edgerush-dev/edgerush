# envoyproxy/ratelimit's limits for bench/envoy-rl.yaml: each client address its own key,
# RL_RATE in a fixed window of a second (bench/run.sh fills in @RATE@), every request
# counted in Redis.
domain: edgerush-bench
descriptors:
  - key: remote_address
    rate_limit:
      unit: second
      requests_per_unit: @RATE@
