# envoyproxy/ratelimit's limits for bench/envoy-rl.yaml: each client address its own key,
# a fixed window of a second that no request reaches, so that every request is counted in
# Redis and none refused.
domain: edgerush-bench
descriptors:
  - key: remote_address
    rate_limit:
      unit: second
      requests_per_unit: 1000000
