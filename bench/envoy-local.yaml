# Envoy as bench/envoy.yaml has it, with its local rate limit: a token bucket for each
# client address, in the process alone, as EdgeRush's local mode (ours-local) keeps one
# (bench/run.sh `ratelimit`, variant envoy-local): RL_RATE a second, RL_BURST deep. Refused,
# a 429. bench/run.sh fills in the @...@ values and, with TLS=1, the listener's certificate.
#
# The generators send no X-Forwarded-For, so `remote_address` is the peer's address without
# `use_remote_address`, which bench/envoy.yaml leaves off as well. The admin interface on
# 127.0.0.1:9901 gives its local_rate_limit counters.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
static_resources:
  listeners:
    - name: web
      address:
        socket_address: { address: 127.0.0.1, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: web
                codec_type: AUTO
                generate_request_id: false
                server_header_transformation: PASS_THROUGH
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: per_client
                      filter_enabled:
                        runtime_key: per_client_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        runtime_key: per_client_enforced
                        default_value: { numerator: 100, denominator: HUNDRED }
                      # A key the descriptor gives no value for: a bucket of its own for each
                      # client address, as many as there are clients.
                      descriptors:
                        - entries: [{ key: remote_address }]
                          token_bucket: { max_tokens: @BURST@, tokens_per_fill: @RATE@, fill_interval: 1s }
                      max_dynamic_descriptors: 1000000
                      rate_limits:
                        - actions:
                            - remote_address: {}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
                route_config:
                  name: routes
                  virtual_hosts:
                    - name: bench
                      domains: ["bench.example.com", "bench.example.com:*"]
                      routes:
                        - match: { path: /health }
                          direct_response: { status: 503 }
                        - match: { prefix: /static }
                          direct_response: { status: 503 }
                        - match:
                            prefix: /api/v1
                            headers:
                              - name: ":method"
                                string_match: { exact: POST }
                          direct_response: { status: 503 }
                        - match: { prefix: / }
                          route: { cluster: backend, timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: http }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: x-request-source, value: edge }
                              append_action: APPEND_IF_EXISTS_OR_ADD
                          request_headers_to_remove: [x-internal-debug]
                          response_headers_to_add:
                            - header: { key: x-served-by, value: edgerush }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          response_headers_to_remove: [server]
                    - name: others
                      domains: ["*.example.org", "*.example.org:*", "www.example.net", "www.example.net:*"]
                      routes:
                        - match: { prefix: / }
                          direct_response: { status: 503 }
  clusters:
    - name: backend
      type: STATIC
      connect_timeout: 5s
      # Its defaults stop at 1024 connections and 1024 requests under way.
      circuit_breakers:
        thresholds:
          - max_connections: 100000
            max_pending_requests: 100000
            max_requests: 100000
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9000 }
