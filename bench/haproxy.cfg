# HAProxy as the proxy under test, doing what proxy.yaml asks of EdgeRush: the same routes,
# the same header changes, keep-alive connections to the same backend. Run by bench/run.sh
# in the foreground; it takes one thread for every CPU it is allowed to run on.
global
    # Two file descriptors for a connection, under the 65536 that run.sh allows.
    maxconn 30000

defaults
    mode http
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s
    timeout http-keep-alive 3600s
    # Any idle connection serves any client's request, as a gateway's pool does.
    http-reuse always

frontend web
    bind 127.0.0.1:8080
    # A request's ID, as EdgeRush's listener gives one by default (08 §3): a UUIDv7 in place
    # of the client's, and the same one on every answer, HAProxy's own included, in place
    # of the upstream's. HAProxy adds its header after the `http-request` rules, which take
    # the client's off first.
    unique-id-format %[uuid(7)]
    unique-id-header x-request-id
    acl bench hdr(host) -i bench.example.com bench.example.com:8080
    acl others hdr_end(host) -i .example.org
    acl others hdr(host) -i www.example.net
    http-request del-header x-request-id
    http-request return status 503 hdr x-request-id %[unique-id] if others
    http-request return status 404 hdr x-request-id %[unique-id] unless bench
    http-request return status 503 hdr x-request-id %[unique-id] if { path /health } || { path_beg /static }
    http-request return status 503 hdr x-request-id %[unique-id] if { path_beg /api/v1 } { method POST }
    # Forwarding, as EdgeRush's listener does it by default: what a client says of it taken
    # off, then the client is the peer, the host as it asked, and `Via` says it came through.
    http-request del-header forwarded
    http-request del-header x-real-ip
    http-request del-header x-forwarded- -m beg
    http-request set-header x-forwarded-for %[src]
    http-request set-header x-forwarded-host %[req.hdr(host)]
    http-request add-header via "%[req.ver] haproxy"
    http-request set-header x-forwarded-proto http
    http-request add-header x-request-source edge
    http-request del-header x-internal-debug
    http-response set-header x-served-by edgerush
    http-response set-header x-request-id %[unique-id]
    http-response del-header server
    default_backend backend

backend backend
    # EdgeRush's default balancer, `p2c`: two servers drawn, the one with fewer in flight.
    balance random(2)
    server nginx 127.0.0.1:9000
