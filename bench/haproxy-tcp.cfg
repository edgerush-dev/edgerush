# HAProxy as the passthrough proxy under test, doing what passthrough.yaml asks of EdgeRush:
# `mode tcp`, 8080 carried to the backend's plain port, and 8443 to its TLS port by the name
# the ClientHello asks for. Run by bench/run.sh in the foreground.
global
    maxconn 30000

defaults
    mode tcp
    timeout connect 5s
    # A tunnel quiet for an hour is closed, as EdgeRush's are.
    timeout client 3600s
    timeout server 3600s

frontend plain
    bind 127.0.0.1:8080
    default_backend plain

backend plain
    server nginx 127.0.0.1:9000

frontend named
    bind 127.0.0.1:8443
    # Wait for the ClientHello, within the first-request deadline EdgeRush keeps.
    tcp-request inspect-delay 10s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend named if { req.ssl_sni -i bench.example.com }
    use_backend named if { req.ssl_sni -m end .example.org }

backend named
    server nginx 127.0.0.1:9443
