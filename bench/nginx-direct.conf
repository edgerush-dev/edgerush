# NGINX answering every request itself, with no upstream: the counterpart of EdgeRush's
# own answer to a host no route is for, in the `frontend` scenarios of bench/run.sh. `ok` for the host the benchmark asks for, 404 for
# any other. Run out of a directory of its own (the -p prefix); WORKERS is filled in.
worker_processes WORKERS;
worker_rlimit_nofile 65536;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 1000000000;
    keepalive_timeout 3600s;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;
    default_type text/plain;

    # Any host but the benchmark's: what EdgeRush answers when no route is for it.
    server {
        listen 127.0.0.1:8080 reuseport backlog=4096 default_server;
        http2 on;
        location / {
            return 404;
        }
    }

    server {
        listen 127.0.0.1:8080;
        http2 on;
        server_name bench.example.com;
        location / {
            return 200 "ok";
        }
    }
}
