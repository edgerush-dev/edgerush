# NGINX as the passthrough proxy under test, doing what passthrough.yaml asks of EdgeRush:
# its `stream` module carrying 8080 to the backend's plain port, and 8443 to its TLS port by
# the name the ClientHello asks for (ssl_preread). Run by bench/run.sh out of a directory of
# its own (the -p prefix); WORKERS is filled in by the script.
worker_processes WORKERS;
worker_rlimit_nofile 65536;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 16384;
}

stream {
    # A tunnel quiet for an hour is closed, as EdgeRush's are.
    proxy_timeout 3600s;
    proxy_connect_timeout 5s;

    map $ssl_preread_server_name $named {
        bench.example.com 127.0.0.1:9443;
        ~\.example\.org$ 127.0.0.1:9443;
        default 127.0.0.1:9;
    }

    server {
        listen 127.0.0.1:8080 reuseport backlog=4096;
        proxy_pass 127.0.0.1:9000;
    }

    server {
        listen 127.0.0.1:8443 reuseport backlog=4096;
        ssl_preread on;
        proxy_pass $named;
    }
}
