# The backend of the macro benchmark: answers everything with a few bytes, as fast as it
# can, so that what is measured is the proxy in front of it. Run by bench/run.sh as the
# user who runs the benchmark, out of a directory of its own (the -p prefix).
worker_processes 2;
worker_rlimit_nofile 65536;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    # The proxy's upstream connections are kept for the whole run: closing them now and
    # then would measure connecting, which is not what the scenarios are about.
    keepalive_requests 1000000000;
    keepalive_timeout 3600s;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    server {
        listen 127.0.0.1:9000 reuseport backlog=4096;
        http2 on;
        default_type text/plain;
        location / {
            return 200 "hello from the backend\n";
        }
    }
}
