# The backend of the macro benchmark: answers everything with a few bytes, as fast as it
# can, so that what is measured is the proxy in front of it. Run by bench/run.sh as the
# user who runs the benchmark, out of a directory of its own (the -p prefix).
worker_processes 2;
worker_rlimit_nofile 65536;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    # The proxy's upstream connections are kept for the whole run: closing them now and
    # then would measure connecting, which is not what the scenarios are about.
    keepalive_requests 1000000000;
    keepalive_timeout 3600s;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    server {
        listen 127.0.0.1:9000 reuseport backlog=4096;
        http2 on;
        default_type text/plain;
        # For the streamed scenarios, and for the hop /sink makes to /taken: the
        # inner request is a request like any other and is held to this too.
        client_max_body_size 64m;
        location / {
            return 200 "hello from the backend\n";
        }
        # A body big enough to be streamed rather than handed over whole. The file is
        # made by run.sh before nginx starts.
        location = /big {
            alias big.bin;
        }
        # The same, trickled: a backend that is slow to answer, which is what an exchange
        # reading an answer over a long time looks like from here.
        location = /slow {
            limit_rate 256k;
            alias slow.bin;
        }
        # Somewhere for a request body to go. A `return` here would answer without
        # reading the body at all and reset a client still sending one; passing it
        # to the location next door reads it, and without buffering it to disk.
        location = /sink {
            # The body is read whole before the hop next door is asked, because that hop
            # answers without reading anything: an answer that arrives before the upload
            # has finished is a different scenario, and one this is not for.
            client_body_buffer_size 16m;
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:9000/taken;
        }
        location = /taken {
            return 200 "taken\n";
        }
        # A gRPC service that answers every unary call with an empty message and OK: a
        # message frame (no compression, no length) and grpc-status in the trailers, which
        # NGINX sends on HTTP/2. The frame is made by run.sh. The static handler takes no
        # POST, so the call is turned into a GET of the answer, the request's message
        # dropped.
        location /bench.Echo/ {
            error_page 405 =200 /grpc-answer;
            return 405;
        }
        location = /grpc-answer {
            internal;
            default_type application/grpc;
            add_trailer grpc-status 0 always;
            alias grpc.bin;
        }
    }
}
