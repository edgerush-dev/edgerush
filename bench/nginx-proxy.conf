# NGINX as the proxy under test, doing what proxy.yaml asks of EdgeRush: the same routes,
# the same header changes, keep-alive connections to the same backend. Run by bench/run.sh
# out of a directory of its own (the -p prefix); WORKERS is filled in by the script.
#
# Not the same to the letter: NGINX names itself in a `server` header that only a
# third-party module could take away, and it sets `x-request-source` where EdgeRush appends.
worker_processes WORKERS;
worker_rlimit_nofile 65536;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 1000000000;
    keepalive_timeout 3600s;
    # Match the streamed-upload scenario; do not reject it at nginx's default 1 MiB.
    client_max_body_size 0;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    # What EdgeRush's listener does by default (03 §11): `Via` names the version the request
    # came in, after whatever the client's said.
    map $server_protocol $via_version {
        "HTTP/1.0" "1.0";
        "HTTP/2.0" "2";
        "HTTP/3.0" "3";
        default "1.1";
    }
    map $http_via $via {
        "" "$via_version nginx";
        default "$http_via, $via_version nginx";
    }

    upstream backend {
        server 127.0.0.1:9000;
        # Idle connections kept by every worker, for the whole run.
        keepalive 1024;
        keepalive_requests 1000000000;
        keepalive_timeout 3600s;
    }

    server {
        listen 127.0.0.1:8080 reuseport backlog=4096 default_server;
        http2 on;
        add_header X-Request-ID $request_id always;
        return 404;
    }

    server {
        listen 127.0.0.1:8080;
        http2 on;
        server_name bench.example.com;

        location = /health { return 503; }
        location /static { return 503; }
        location /api/v1 {
            if ($request_method = POST) { return 503; }
            proxy_pass http://backend;
        }
        location / {
            proxy_pass http://backend;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        # Forwarding, as EdgeRush's listener does it by default: the client is the peer, the
        # host is as it asked, `Via` says the request came through, and what else a client
        # says of forwarding is taken off. NGINX takes off a fixed list, where EdgeRush takes
        # off every `X-Forwarded-*`: the six Traefik keeps.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Via $via;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Uri "";
        proxy_set_header X-Request-Source edge;
        proxy_set_header X-Internal-Debug "";
        add_header X-Served-By edgerush;
        # A request's ID, as EdgeRush's listener gives one by default (08 §3): the client's
        # replaced, the same one on every answer, NGINX's own included, in place of the
        # upstream's. NGINX's is 32 hexadecimal digits, not a UUIDv7.
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
    }

    server {
        listen 127.0.0.1:8080;
        http2 on;
        server_name *.example.org www.example.net;
        add_header X-Request-ID $request_id always;
        return 503;
    }
}
