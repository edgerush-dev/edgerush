name: Bug report
description: Something EdgeRush does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem goes privately, never here: see [SECURITY.md](https://github.com/edgerush-dev/edgerush/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The requests or steps that show it, from a fresh start.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The smallest config that shows it.
      render: yaml
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture.
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What EdgeRush printed, if anything bears on it.
      render: text
