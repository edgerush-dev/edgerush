name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts help a developer editing one crate; here they would only make the
  # cache bigger.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # check.sh itself, so that CI and a local run cannot ask for different things. On Linux
    # alone: it is the platform EdgeRush is for, and Windows is only where it is developed.
    name: check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Pinned to a commit; Dependabot moves the pin and the version after it together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler; rustup on the runner installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The dependencies as main last built them (BoringSSL takes minutes) and cargo-deny.
      # Keyed on the lock files and the toolchain, so a change to either starts a new entry
      # from the nearest old one.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            fuzz/target
          key: ${{ runner.os }}-check-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-

      # The version check.sh is run with, from crates.io rather than a third-party action.
      - name: cargo-deny
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != "cargo-deny 0.20.2" ]; then
            cargo install --locked cargo-deny@0.20.2
          fi

      - name: Checks
        run: ./check.sh

      # check.sh builds as a developer does, bringing a lock file up to date if it has to;
      # here one that no longer matches its manifest fails instead.
      - name: Lock files unchanged
        run: git diff --exit-code Cargo.lock fuzz/Cargo.lock

      # From main alone, and only once all is green: a pull request's cache could serve only
      # that pull request, and it is main's that every run starts from.
      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            fuzz/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
