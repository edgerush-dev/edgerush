name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Pinned to a commit: actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # rust-toolchain.toml pins the compiler; rustup on the runner installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The proxy's benchmarks need its `fuzzing` feature, which --all-targets leaves off:
      # built here so that one that no longer compiles is seen, as check.sh does.
      - name: Benchmarks build
        run: cargo check -p edgerush-proxy --features fuzzing --benches --locked

      - name: Test
        run: cargo test --workspace --locked

  dependencies:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The version check.sh is run with, from crates.io rather than a third-party action.
      - name: cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # As check.sh runs it: deny.toml, for the workspace's lock file and fuzz/'s.
      - name: Dependencies
        run: |
          cargo deny check --allow license-exception-not-encountered
          cargo deny --manifest-path fuzz/Cargo.toml check --allow advisory-not-detected
