name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts help a developer editing one crate; here they would only make the
  # cache bigger.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # check.sh itself, so that CI and a local run cannot ask for different things. On Linux
    # alone: it is the platform EdgeRush is for, and Windows is only where it is developed.
    name: check.sh
    # A named release rather than ubuntu-latest, which GitHub moves on its own date: the
    # system the checks run on changes deliberately, in its own commit, as the toolchain does.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Pinned to a commit; Dependabot moves the pin and the version after it together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler; rustup on the runner installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The third-party dependencies as main last built them (BoringSSL takes minutes) and
      # cargo-deny. Keyed on the lock files and the toolchain, so a change to either starts a
      # new entry from the nearest old one.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            fuzz/target
          key: ${{ runner.os }}-deps-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      # The version check.sh is run with, from crates.io rather than a third-party action.
      - name: cargo-deny
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != "cargo-deny 0.20.2" ]; then
            cargo install --locked cargo-deny@0.20.2
          fi

      # The test runner check.sh runs the tests with: the same version, as nextest releases it
      # built, checked against the SHA-256 published beside it. Seconds, where building it took
      # three minutes, and nothing for the cache to carry: an entry is found only by the paths
      # it was saved with, and one more would leave every entry saved before it unread.
      - name: cargo-nextest
        env:
          VERSION: 0.9.152
          SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
        run: |
          archive="cargo-nextest-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C ~/.cargo/bin cargo-nextest
          cargo nextest --version

      - name: Checks
        run: ./check.sh

      # check.sh builds as a developer does, bringing a lock file up to date if it has to;
      # here one that no longer matches its manifest fails instead.
      - name: Lock files unchanged
        run: git diff --exit-code Cargo.lock fuzz/Cargo.lock

      # What is saved is the third-party dependencies alone. EdgeRush's own crates and their
      # tests change with every pull request and are built again whatever the cache holds;
      # saved as well, they made the cache 8 GB, five minutes to restore for three of building
      # saved. Vendored quiche and h2 are kept: they change only when vendor/ does.
      - name: Keep only the dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # `-p` and the name of each package of ours, one a line. Never empty: `cargo clean`
          # with no package named would empty the whole target directory.
          ours() {
            cargo metadata --format-version 1 --locked --manifest-path "$1" | python3 -c '
          import json, sys
          for p in json.load(sys.stdin)["packages"]:
              if p["source"] is None and "/vendor/" not in p["manifest_path"]:
                  print("-p"); print(p["name"])'
          }
          workspace=$(ours Cargo.toml) && [ -n "$workspace" ]
          fuzz=$(ours fuzz/Cargo.toml) && [ -n "$fuzz" ]
          du -sh target fuzz/target
          cargo clean $workspace
          cargo clean --target-dir target/loom $workspace
          cargo clean --manifest-path fuzz/Cargo.toml $fuzz
          rm -rf target/doc
          du -sh target fuzz/target

      # Only once all is green.
      - name: Save the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
            fuzz/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
