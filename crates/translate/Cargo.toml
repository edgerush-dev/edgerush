[package]
name = "edgerush-translate"
description = "EdgeRush translation: Kubernetes objects into a data plane's config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A Secret's certificate is read as the data plane will read it, by the same code.
edgerush-certificates.workspace = true
edgerush-config.workspace = true
# The Gateway API kinds translated.
edgerush-gateway-api.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Golden tests read manifests and configs the way files hold them, and write each config
# translated as the control plane does. The crate knows no format.
serde-saphyr = { workspace = true, features = ["serialize"] }

[lints]
workspace = true
