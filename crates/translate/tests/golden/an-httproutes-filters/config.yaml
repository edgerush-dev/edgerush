listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  low:
    address: "[::]:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: httproute/shop/filters/http
    listeners: [http]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /headers } }]
        filters:
          - { type: request_header_modifier, set: [{ name: X-A, value: "1" }], add: [{ name: X-B, value: "2" }], remove: [X-C] }
          - { type: response_header_modifier, set: [{ name: X-D, value: "3" }], add: [], remove: [] }
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /to-https } }]
        redirect: { status: 302, scheme: https, query: keep }
      - matches: [{ path: { prefix: /to-host } }]
        redirect: { status: 301, host: example.org, port: 8080, query: keep }
      - matches: [{ path: { prefix: /to-port } }]
        redirect: { status: 302, scheme: https, port: 8443, path: { replace_full: /full }, query: keep }
      - matches: [{ path: { prefix: /moved } }]
        filters: [{ type: response_header_modifier, set: [{ name: X-R, value: "1" }], add: [], remove: [] }]
        redirect: { status: 302, port: 8080, path: { replace_prefix: /new }, query: keep }
      - matches: [{ path: { prefix: /rewritten } }]
        filters: [{ type: url_rewrite, host: internal.example.com, path: { replace_prefix: /v2 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /bad-header } }]
        forward: { backends: [{ invalid: "the data plane would refuse it: route `httproute`, rules[0], filters[0]: header `host` is the gateway's own and cannot be modified", weight: 1 }] }
      - matches: [{ path: { prefix: /unknown } }]
        forward: { backends: [{ invalid: "a filter of type `Gzip` is not one translation reads", weight: 1 }] }
  - name: httproute/shop/low/low
    listeners: [low]
    hostnames: [{ name: low.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        redirect: { status: 302, host: example.org, query: keep }
  - name: gateway/edge/web/low
    listeners: [low]
    hostnames: [{ name: low.example.com, falls_through: false }]
    rules: []
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
