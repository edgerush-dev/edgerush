listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/by-address/address.example.com
    listeners: [http]
    hostnames: [{ name: address.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http/service, weight: 1 }] }
      - matches: [{ path: { prefix: /pods } }]
        forward: { backends: [{ invalid: "Service shop/pods has no cluster IP for gateway.edgerush.dev/service-upstream to reach it by", weight: 1 }] }
  - name: ingress/shop/by-endpoints/endpoints.example.com
    listeners: [http]
    hostnames: [{ name: endpoints.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
  shop/web/http/service: { load_balancer: p2c, endpoints: { dns: "web.shop.svc.cluster.local:80" } }
