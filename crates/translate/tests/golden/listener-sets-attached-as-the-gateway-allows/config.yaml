listeners:
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-9000:
    address: "0.0.0.0:9000"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: httproute/shop/team/shop/team/api
    listeners: [port-9000]
    hostnames: [{ name: api.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /team } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/api.example.com
    listeners: [port-80, port-9000]
    hostnames: [{ name: api.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - { name: listenerset/shop/team/api, listeners: [port-9000], hostnames: [{ name: api.example.com, falls_through: false }], rules: [] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
