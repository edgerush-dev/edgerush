listeners:
  port-8080:
    address: "0.0.0.0:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-8443:
    address: "0.0.0.0:8443"
    protocol: tls
    proxy_protocol: off
  port-9444:
    address: "0.0.0.0:9444"
    protocol: tls
    proxy_protocol: off
  port-9445:
    address: "0.0.0.0:9445"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls: { certificates: [], without_sni: none, refused: [] }
routes: []
upstreams: {}
