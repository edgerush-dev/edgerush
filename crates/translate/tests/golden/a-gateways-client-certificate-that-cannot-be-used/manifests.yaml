# A Gateway's client certificate for backends, a Secret of its own namespace with no key:
# its ResolvedRefs false InvalidClientCertificateRef, as conformance's malformed Secret, the
# Gateway still accepted, and the backend a BackendTLSPolicy covers reached over TLS without
# one.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
  tls:
    backend:
      clientCertificateRef: { name: keyless }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web }]
  hostnames: [route.example.com]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: tls, namespace: shop }
spec:
  targetRefs: [{ group: "", kind: Service, name: web }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: web.shop.example
---
