listeners:
  port-8080:
    address: 0.0.0.0:8080
    protocol: http
    forwarding:
      trusted_proxies: []
      trusted_only_headers:
      - Forwarded
      - X-Real-IP
      - X-Forwarded-*
    request_id: generate
    proxy_protocol: 'off'
  port-9000:
    address: 0.0.0.0:9000
    protocol: tcp
    proxy_protocol: 'off'
routes:
- name: httproute/shop/pages/http
  listeners:
  - port-8080
  hostnames:
  - name: shop.example.com
    falls_through: false
  rules:
  - matches:
    - path:
        prefix: /api
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/api/https
        weight: 1
    rate_limits: []
  - matches:
    - path:
        prefix: /web
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/web/https
        weight: 1
    rate_limits: []
  - matches:
    - path:
        prefix: /full
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - invalid: 'Service shop/full port https is covered by BackendTLSPolicy shop/full, whose TLS cannot
          be had: its status holds 16 ancestors already, none of them Gateway shop/web, so it cannot be
          implemented there'
        weight: 1
    rate_limits: []
  - matches:
    - path:
        prefix: /room
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/room/https
        weight: 1
    rate_limits: []
  rate_limits: []
tcp_routes:
- name: tcproute/shop/carried/raw
  listeners:
  - port-9000
  backends:
  - upstream: shop/tunneled/https/tcp
    weight: 1
tls_routes: []
