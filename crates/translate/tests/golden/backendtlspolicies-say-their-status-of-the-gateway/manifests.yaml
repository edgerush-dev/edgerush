apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }, { name: admin, port: 8443 }]
---
apiVersion: v1
kind: Service
metadata: { name: full, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: room, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
