# The shared data plane, as the Gateway edge/web, limiting locally under one global limit.
ingress_class: edge
gateway: edge/web
cluster_domain: cluster.local
ingress_hosts_fall_through: false
ingress_https_redirect: true
ingress_https_redirect_max_age: 30
rate_limiting:
  mode: local
  global:
    - { name: platform, key: client, model: { bucket: { rate: 100/s, burst: 200 } } }
