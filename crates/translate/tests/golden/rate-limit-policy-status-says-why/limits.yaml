  dry_run: false
- name: on-redirect-per-client
  match: null
  key: client
  model:
    bucket:
      rate: 5/s
      burst: 5
  dry_run: false
- name: on-moved-per-client
  match: null
  key: client
  model:
    bucket:
      rate: 5/s
      burst: 5
  dry_run: false
- name: elsewhere-per-client
  match: null
  key: client
