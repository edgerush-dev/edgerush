# None of the Gateway's listeners can be served, its one of a protocol not taken yet: it
# serves nothing, and that is said, and the data plane binds no port for it.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: edge }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: tcp, port: 80, protocol: TCP }
