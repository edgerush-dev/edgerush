listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: httproute/shop/across/http
    listeners: [http]
    hostnames: [{ name: across.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /granted } }]
        forward: { backends: [{ upstream: blog/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /every-service } }]
        forward: { backends: [{ upstream: books/anything/http, weight: 1 }] }
      - matches: [{ path: { prefix: /not-there } }]
        forward: { backends: [{ invalid: "Service books/gone does not exist", weight: 1 }] }
      - matches: [{ path: { prefix: /refused } }]
        forward: { backends: [{ invalid: "Service news/web is another namespace's, and no ReferenceGrant there lets HTTPRoutes of shop reach it", weight: 3 }, { upstream: blog/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /own } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
upstreams:
  blog/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.blog.svc.cluster.local:http" } }
  books/anything/http: { load_balancer: p2c, endpoints: { kubernetes: "anything.books.svc.cluster.local:http" } }
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
