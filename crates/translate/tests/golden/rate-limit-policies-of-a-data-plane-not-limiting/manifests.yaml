# A RateLimitPolicy on an Ingress of a data plane with no rate limiting, the shared one: no
# rule is under a limit, and the config carries none.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: app, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: app.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app, port: { name: http } } } }
---
apiVersion: v1
kind: Service
metadata: { name: app, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: gateway.edgerush.dev/v1alpha1
kind: RateLimitPolicy
metadata: { name: app, namespace: shop }
spec:
  targetRefs: [{ group: networking.k8s.io, kind: Ingress, name: app }]
  limits: [{ name: app-per-client, key: Client, model: { bucket: { rate: 10/s, burst: 10 } } }]
