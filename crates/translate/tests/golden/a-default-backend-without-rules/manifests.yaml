# An Ingress without rules sends every request to its default backend: a `/` path on `*`,
# which takes every host no rule names. A second such Ingress has the same path on the
# same host, and is reported.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: catch-all, namespace: shop }
spec:
  ingressClassName: edge
  defaultBackend: { service: { name: web, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: spare, namespace: shop }
spec:
  ingressClassName: edge
  defaultBackend: { service: { name: web, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
