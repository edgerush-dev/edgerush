# A Gateway's spec.tls.frontend validating its clients' certificates in AllowInsecureFallback
# on every port its default's validation is for, 443 here: the data plane's listener asks
# each client for a certificate its CA certificates vouch for and lets it through without
# one, and the Gateway says so (InsecureFrontendValidationMode). A perPort entry holds its
# port to AllowValidOnly, as unsaid: 8443's clients are refused without one. An Ingress's
# TLS host sharing 443, a listener of its own there, is let through alike, and that is said.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
          mode: AllowInsecureFallback
      perPort:
        - port: 8443
          tls:
            validation:
              caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
  listeners:
    - name: secure
      port: 443
      protocol: HTTPS
      tls: { certificateRefs: [{ name: shop-tls }] }
    - name: strict
      port: 8443
      protocol: HTTPS
      hostname: strict.example.com
      tls: { certificateRefs: [{ name: shop-tls }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: legacy, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ hosts: [legacy.example.com], secretName: wild }]
  rules:
    - host: legacy.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }] }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
