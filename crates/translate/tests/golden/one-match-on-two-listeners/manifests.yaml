# One match on two listeners: a route on each, alike in host and path, shadows nothing of
# the other's, as a request comes to one listener or the other; of two routes on both, the
# newer is shadowed on each, and said once.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: edge }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP, allowedRoutes: { namespaces: { from: All } } }
    - { name: alt, port: 9090, protocol: HTTP, allowedRoutes: { namespaces: { from: All } } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: on-http, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, namespace: edge, sectionName: http }]
  hostnames: [same.example.com]
  rules:
    - matches: [{ path: { value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: on-alt, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, namespace: edge, sectionName: alt }]
  hostnames: [same.example.com]
  rules:
    - matches: [{ path: { value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: first, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, namespace: edge }]
  hostnames: [both.example.com]
  rules:
    - matches: [{ path: { value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: second, namespace: shop, creationTimestamp: "2026-02-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, namespace: edge }]
  hostnames: [both.example.com]
  rules:
    - matches: [{ path: { value: / } }]
      backendRefs: [{ name: web, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
