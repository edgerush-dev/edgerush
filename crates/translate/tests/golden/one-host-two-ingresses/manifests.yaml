# Two Ingresses on one host. The router ranks a path, then the older Ingress first, so a
# path the newer has the same way as the older never takes a request: it is said, and
# the newer is translated all the same, its other paths taking theirs. `/api` exactly is
# another match than `/api` as a prefix, and the same path twice in one Ingress is
# shadowed by its own earlier rule.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: newer, namespace: shop, creationTimestamp: "2026-10-02T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api-v2, port: { number: 80 } } } }
          - { path: /api, pathType: Exact, backend: { service: { name: api-v2, port: { number: 80 } } } }
          - { path: /static, pathType: Prefix, backend: { service: { name: api-v2, port: { number: 80 } } } }
          - { path: /static, pathType: ImplementationSpecific, backend: { service: { name: api-v2, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: older, namespace: shop, creationTimestamp: "2026-10-01T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: api-v2, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
