# A Gateway's TLS listener alone on port 443, Ingress's HTTPS port, shares it with the
# hosts an Ingress serves over TLS there (Q-t6): the port is bound for HTTPS, the TLS
# listener a sharer passing its names through, the Ingress's host served by SNI. A port of
# TLS listeners alone that is not Ingress's stays `tls`. A host an Ingress serves over
# plain HTTP alone that a TLS listener names is joined to no TLS listener: it is served
# over plain HTTP, its connections over TLS carried.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: api, port: 443, protocol: TLS, hostname: api.example.com, tls: { mode: Passthrough } }
    - { name: other, port: 8443, protocol: TLS, hostname: api.example.com, tls: { mode: Passthrough } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: api, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web }]
  hostnames: [api.example.com]
  rules:
    - backendRefs: [{ name: api, port: 8443 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  ingressClassName: edge
  tls: [{ hosts: [shop.example.com], secretName: shop-tls }]
  rules:
    - host: shop.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: plain, namespace: shop, creationTimestamp: "2026-01-02T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: api.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }] }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec:
  ports: [{ name: tls, port: 8443 }]
