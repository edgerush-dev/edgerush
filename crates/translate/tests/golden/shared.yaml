# Objects every case's cluster has: the data plane's IngressClass, which names this
# controller.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: { name: edge }
spec:
  controller: edgerush.dev/ingress-controller
# Secrets the TLS cases' Ingresses name, in namespace shop. Test certificates, self-signed,
# made for these tests alone: shop-tls carries shop.example.com; wild, *.example.com and
# *.apps.example.com, as an Opaque Secret written in `data`; secure, secure.example.com
# and www.secure.example.com; keyless has no key; mismatched pairs shop-tls's certificate
# with another key.
