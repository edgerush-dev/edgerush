listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  https:
    address: "[::]:8443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/wild, names: [e.example.com] }
      without_sni: none
      refused: [a.example.com, b.example.com, c.example.com, d.example.com]
routes:
  - name: ingress/shop/web/a.example.com/https-redirect
    listeners: [http]
    hostnames: [{ name: "a.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        redirect: { status: 308, scheme: https, port: 8443, query: keep }
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=120" }] }]
  - name: ingress/shop/web/b.example.com/https-redirect
    listeners: [http]
    hostnames: [{ name: "b.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        redirect: { status: 308, scheme: https, port: 8443, query: keep }
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=120" }] }]
  - name: ingress/shop/web/c.example.com/https-redirect
    listeners: [http]
    hostnames: [{ name: "c.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        redirect: { status: 308, scheme: https, port: 8443, query: keep }
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=120" }] }]
  - name: ingress/shop/web/e.example.com
    listeners: [https]
    hostnames: [{ name: "e.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/e.example.com/https-redirect
    listeners: [http]
    hostnames: [{ name: "e.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        redirect: { status: 308, scheme: https, port: 8443, query: keep }
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=120" }] }]
  - name: ingress/shop/extra/a.example.com/https-redirect
    listeners: [http]
    hostnames: [{ name: "a.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /extra } }]
        redirect: { status: 308, scheme: https, port: 8443, query: keep }
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=120" }] }]
  - name: ingress/shop/kept/d.example.com
    listeners: [http]
    hostnames: [{ name: "d.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
