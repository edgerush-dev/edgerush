# TLSRoutes on a Gateway's TLS listeners, their connections passed through by SNI: each
# attachment a passthrough route, its hostnames the route's and the listener's met, those
# of a more specific listener on the port taken away; a listener hostname no route takes
# claimed and closed, so that no less specific listener's route serves it. Backends in
# proportion to their weights, an invalid one's share closed (missing, or of another
# namespace no ReferenceGrant from TLSRoutes lets it reach); a port reached in the clear
# whatever its appProtocol, named apart from the HTTP upstream where that one differs. Of
# two TLSRoutes with one hostname on a listener the older serves it, the other said. A
# TLSRoute of the shapes only an older API version gives, more rules than one or no
# hostname, is not accepted.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: wild, port: 8443, protocol: TLS, hostname: "*.example.com", tls: { mode: Passthrough } }
    - { name: api, port: 8443, protocol: TLS, hostname: api.example.com, tls: { mode: Passthrough } }
    - { name: idle, port: 8443, protocol: TLS, hostname: idle.example.com, tls: { mode: Passthrough } }
    - { name: open, port: 9443, protocol: TLS, tls: { mode: Passthrough } }
    - { name: narrow, port: 8443, protocol: TLS, hostname: db.example.com, tls: { mode: Passthrough } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: weighted, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, sectionName: wild }]
  hostnames: ["*.example.com"]
  rules:
    - backendRefs: [{ name: web, port: 443, weight: 3 }, { name: gone, port: 443, weight: 1 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: later, namespace: shop, creationTimestamp: "2026-02-01T00:00:00Z" }
spec:
  parentRefs: [{ name: web, sectionName: wild }]
  hostnames: ["*.example.com", shop.example.com]
  rules:
    - backendRefs: [{ name: secure, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: api, namespace: shop }
spec:
  parentRefs: [{ name: web }]
  hostnames: [api.example.com]
  rules:
    - backendRefs: [{ name: db, namespace: blog, port: 5432 }, { name: levels, namespace: stock, port: 5432 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: anywhere, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: open }]
  hostnames: [db.example.org, "*.example.net"]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: wide, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: narrow }]
  hostnames: ["*.example.com", other.test]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: two-rules, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: open }]
  hostnames: [two.example.org]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: { name: nameless, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: open }]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: from-shop, namespace: blog }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: TLSRoute, namespace: shop }]
  to: [{ group: "", kind: Service }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: from-shop-http, namespace: stock }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: shop }]
  to: [{ group: "", kind: Service }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }, { name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: secure, namespace: shop }
spec:
  ports: [{ name: https, port: 443, appProtocol: kubernetes.io/wss }]
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: blog }
spec:
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: levels, namespace: stock }
spec:
  ports: [{ name: postgres, port: 5432 }]
