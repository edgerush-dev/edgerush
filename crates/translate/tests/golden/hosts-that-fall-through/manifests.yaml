# The same hosts on a data plane whose Ingress hosts fall through, as Gateway API's do
# (`ingress.hostFallThrough: true` on its DataPlane, 04 §5).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: hosts, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: "*.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
