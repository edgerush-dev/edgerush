# An ExternalName Service is never a backend: its name can lead anywhere (04 §2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: away, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: elsewhere, port: { number: 443 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: elsewhere, namespace: shop }
spec:
  type: ExternalName
  externalName: api.example.net
  ports: [{ port: 443 }]
