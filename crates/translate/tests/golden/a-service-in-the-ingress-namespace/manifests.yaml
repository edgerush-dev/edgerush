# A backend's Service is the one of that name in the Ingress's namespace: a Service of the
# same name elsewhere is not it, and one only elsewhere is missing.
apiVersion: v1
kind: Service
metadata: { name: web, namespace: other }
spec:
  ports: [{ name: elsewhere, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: solo, namespace: other }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: lonely, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: solo.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: solo, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
