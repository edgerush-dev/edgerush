# A ListenerSet's HTTPS listeners read Secrets of its own namespace freely, and another's
# where a ReferenceGrant there lets ListenerSets of its namespace: shop's is let reach
# edge's. A grant to Gateways is not a ListenerSet's: blog's, which holds one alone, is
# refused that Secret, and its listener is accepted, serving nothing.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: edge }
spec:
  gatewayClassName: edgerush
  allowedListeners: { namespaces: { from: All } }
  listeners:
    - { name: http, port: 80, protocol: HTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata: { name: team, namespace: shop }
spec:
  parentRef: { name: web, namespace: edge }
  listeners:
    - name: own-namespace
      port: 8443
      protocol: HTTPS
      hostname: secure.example.com
      tls: { certificateRefs: [{ name: secure }] }
    - name: granted
      port: 8443
      protocol: HTTPS
      hostname: own.example.com
      tls: { certificateRefs: [{ name: own, namespace: edge }] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata: { name: other, namespace: blog }
spec:
  parentRef: { name: web, namespace: edge }
  listeners:
    - name: ungranted
      port: 8443
      protocol: HTTPS
      hostname: blog.example.com
      tls: { certificateRefs: [{ name: own, namespace: edge }] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata: { name: listener-sets-of-shop, namespace: edge }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: ListenerSet, namespace: shop }]
  to: [{ group: "", kind: Secret }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata: { name: gateways-of-blog, namespace: edge }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: Gateway, namespace: blog }]
  to: [{ group: "", kind: Secret }]
