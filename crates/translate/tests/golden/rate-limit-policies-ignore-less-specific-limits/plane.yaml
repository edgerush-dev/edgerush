# The shared data plane, as the Gateway edge/web, limiting locally under two global limits.
ingress_class: edge
gateway: edge/web
cluster_domain: cluster.local
ingress_hosts_fall_through: false
ingress_https_redirect: true
ingress_https_redirect_max_age: 30
rate_limiting:
  mode: local
  global:
    - { name: platform-per-ip, key: client, model: { bucket: { rate: 100/s, burst: 200 } } }
    - { name: platform-writes, match: { methods: [POST, PUT] }, key: client, model: { bucket: { rate: 20/s, burst: 20 } } }
