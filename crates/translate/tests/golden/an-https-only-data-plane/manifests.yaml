# With no `http` listener, hosts whose Secret can be used are served over HTTPS alone; one
# whose Secret is not there is served nowhere, and only that is said of it, not its
# missing backend, nor the upstream it would have had; an Ingress with a host it does not
# secure is left out.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ hosts: [secure.example.com, www.secure.example.com], secretName: secure }]
  rules:
    - host: "secure.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: "www.secure.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web2, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ hosts: [gone.example.com], secretName: gone }]
  rules:
    - host: gone.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: missing, port: { number: 80 } } } }
          - { path: /other, pathType: Prefix, backend: { service: { name: other, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: plain, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: plain.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: other, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
