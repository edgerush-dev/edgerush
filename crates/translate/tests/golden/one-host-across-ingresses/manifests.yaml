spec:
  ingressClassName: edge
  tls: [{ hosts: [shop.example.com], secretName: gone }]
  rules:
    - host: "shop.example.com"
      http:
        paths:
          - { path: /d, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: w, namespace: shop, creationTimestamp: "2026-05-01T00:00:00Z" }
spec:
  ingressClassName: edge
  tls: [{ hosts: ["*.example.com"], secretName: wild }]
  rules:
    - host: "*.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: p, namespace: shop, creationTimestamp: "2026-06-01T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: "*.p.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: "test.example.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
