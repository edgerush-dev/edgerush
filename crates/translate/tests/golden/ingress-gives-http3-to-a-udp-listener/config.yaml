listeners:
  port-443:
    address: "0.0.0.0:443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/shop-tls, names: [shop.example.com] }
      without_sni: none
  port-443-udp:
    address: "0.0.0.0:443"
    protocol: udp
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/site/shop.example.com
    listeners: [port-443]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/site/shop.example.com/https-redirect
    listeners: [port-80]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: max-age=30 }] }]
        redirect: { status: 308, scheme: https, query: keep }
udp_routes:
  - { name: gateway/shop/web/quic, listeners: [port-443-udp], backends: [{ invalid: no UDPRoute serves listener quic, weight: 1 }] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
