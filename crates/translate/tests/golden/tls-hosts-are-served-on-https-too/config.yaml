listeners:
  port-443:
    address: "0.0.0.0:443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/wild, names: [api.example.com, "*.apps.example.com", blog.example.com] }
        - { certificate: shop/shop-tls, names: [shop.example.com] }
      without_sni: none
      refused: [plain.example.com]
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/web/api.example.com
    listeners: [port-80, port-443]
    hostnames: [{ name: "api.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/plain.example.com
    listeners: [port-80]
    hostnames: [{ name: "plain.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/shop.example.com
    listeners: [port-80, port-443]
    hostnames: [{ name: "shop.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/blog/*.apps.example.com
    listeners: [port-80, port-443]
    hostnames: [{ name: "*.apps.example.com", wildcard: one_label, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/blog/blog.example.com
    listeners: [port-80, port-443]
    hostnames: [{ name: "blog.example.com", falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
