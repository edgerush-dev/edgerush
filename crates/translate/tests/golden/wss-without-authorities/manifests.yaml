# A kubernetes.io/wss port is spoken to over TLS, which needs authorities to trust. A data
# plane given none answers its path 500, and the report says why.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: chat, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: chat.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: chat, port: { number: 443 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: chat, namespace: shop }
spec:
  ports: [{ name: wss, port: 443, appProtocol: kubernetes.io/wss }]
