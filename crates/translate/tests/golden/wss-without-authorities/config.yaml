listeners:
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/chat/chat.example.com
    listeners: [port-80]
    hostnames: [{ name: chat.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ invalid: "Service shop/chat port wss is kubernetes.io/wss, and the data plane trusts no authorities for TLS to backends", weight: 1 }] }
upstreams: {}
