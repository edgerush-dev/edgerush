listeners:
  port-8080:
    address: 0.0.0.0:8080
    protocol: http
    forwarding:
      trusted_proxies: []
      trusted_only_headers:
      - Forwarded
      - X-Real-IP
      - X-Forwarded-*
    request_id: generate
    proxy_protocol: 'off'
routes:
- name: httproute/shop/pages/http
  listeners:
  - port-8080
  hostnames:
  - name: shop.example.com
    falls_through: false
  rules:
  - matches:
    - path:
        prefix: /
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/web/https
        weight: 1
    rate_limits: []
  rate_limits: []
tcp_routes: []
tls_routes: []
upstreams:
  shop/web/https:
    endpoints:
      kubernetes: web.shop.svc.cluster.local:https
    protocol: http1
    load_balancer: p2c
