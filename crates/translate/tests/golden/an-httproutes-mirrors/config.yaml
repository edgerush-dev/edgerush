listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: httproute/shop/mirrors/http
    listeners: [http]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /every } }]
        filters: [{ type: request_mirror, upstream: shop/shadow/http, fraction: { numerator: 1, denominator: 1 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /percent } }]
        filters: [{ type: request_mirror, upstream: shop/shadow/http, fraction: { numerator: 20, denominator: 100 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /fraction } }]
        filters: [{ type: request_mirror, upstream: shop/shadow/http, fraction: { numerator: 1, denominator: 3 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /two } }]
        filters: [{ type: request_mirror, upstream: shop/shadow/http, fraction: { numerator: 50, denominator: 100 } }, { type: request_mirror, upstream: shop/canary/http, fraction: { numerator: 1, denominator: 1 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /not-there } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /not-permitted } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /granted } }]
        filters: [{ type: request_mirror, upstream: books/web/http, fraction: { numerator: 1, denominator: 1 } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: /redirected } }]
        forward: { backends: [{ invalid: "a mirror beside a redirect, which sends nothing upstream to copy", weight: 1 }] }
upstreams:
  books/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.books.svc.cluster.local:http" } }
  shop/canary/http: { load_balancer: p2c, endpoints: { kubernetes: "canary.shop.svc.cluster.local:http" } }
  shop/shadow/http: { load_balancer: p2c, endpoints: { kubernetes: "shadow.shop.svc.cluster.local:http" } }
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
