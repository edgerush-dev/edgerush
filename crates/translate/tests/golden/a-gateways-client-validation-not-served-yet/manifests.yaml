# A Gateway's spec.tls.frontend validating clients' certificates, which is not served yet:
# an HTTPS listener on a port it validates clients on is not accepted, its ListenerSets'
# as its own, and takes no port, so that no client reaches it unchecked. Its default's
# validation is for every port but those a perPort entry names: 8443's names none. The
# TLS listener on 443 passes its connections through, reading no client certificate, and
# is served; the HTTP listener has no TLS to validate in.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  allowedListeners: { namespaces: { from: Same } }
  tls:
    frontend:
      default:
        validation: { caCertificateRefs: [{ group: "", kind: ConfigMap, name: client-ca }] }
      perPort:
        - { port: 8443, tls: {} }
  listeners:
    - { name: plain, port: 80, protocol: HTTP }
    - name: secure
      port: 443
      protocol: HTTPS
      tls: { certificateRefs: [{ name: shop-tls }] }
    - name: passed
      port: 443
      protocol: TLS
      hostname: tls.example.com
      tls: { mode: Passthrough }
    - name: open
      port: 8443
      protocol: HTTPS
      hostname: open.example.com
      tls: { certificateRefs: [{ name: shop-tls }] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata: { name: team, namespace: shop }
spec:
  parentRef: { name: web }
  listeners:
    - name: team
      port: 9443
      protocol: HTTPS
      hostname: team.example.com
      tls: { certificateRefs: [{ name: secure }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: client-ca, namespace: shop }
data:
  ca.crt: "not read while validation is not served"
