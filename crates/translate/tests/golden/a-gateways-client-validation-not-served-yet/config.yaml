listeners:
  port-443:
    address: "0.0.0.0:443"
    protocol: tls
    proxy_protocol: off
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-8443:
    address: "0.0.0.0:8443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/shop-tls, names: [open.example.com] }
      without_sni: none
routes:
  - { name: gateway/shop/web/open, listeners: [port-8443], hostnames: [{ name: open.example.com, falls_through: false }], rules: [] }
tls_routes:
  - { name: gateway/shop/web/passed, listeners: [port-443], hostnames: [{ name: tls.example.com, falls_through: false }], backends: [{ invalid: "no TLSRoute takes tls.example.com on listener passed", weight: 1 }] }
upstreams: {}
