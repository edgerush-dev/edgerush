# BackendTLSPolicies covering the same Service: the older takes it, the younger conflicted
# there and still covering the other Service it names; one naming a port takes that port
# from one naming the whole Service, both covering what they take; of two naming the same
# port at the same moment, the first by name takes it; and targets that are not there, or
# not Services, are said, covering nothing.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web }]
  hostnames: [shop.example.com]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /admin } }]
      backendRefs: [{ name: web, port: 8443 }]
    - matches: [{ path: { type: PathPrefix, value: /other } }]
      backendRefs: [{ name: other, port: 443 }]
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: elder, namespace: shop, creationTimestamp: "2025-01-01T00:00:00Z" }
spec:
  targetRefs: [{ group: "", kind: Service, name: web }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: elder.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: younger, namespace: shop, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  targetRefs:
    - { group: "", kind: Service, name: web }
    - { group: "", kind: Service, name: other }
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: younger.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: sectioned, namespace: shop, creationTimestamp: "2026-06-01T00:00:00Z" }
spec:
  targetRefs: [{ group: "", kind: Service, name: web, sectionName: admin }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: sectioned.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: sectioned-twin, namespace: shop, creationTimestamp: "2026-06-01T00:00:00Z" }
spec:
  targetRefs: [{ group: "", kind: Service, name: web, sectionName: admin }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: twin.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: stray, namespace: shop, creationTimestamp: "2026-07-01T00:00:00Z" }
spec:
  targetRefs:
    - { group: "", kind: Service, name: gone }
    - { group: "", kind: Service, name: web, sectionName: missing }
    - { group: gateway.networking.k8s.io, kind: Gateway, name: web }
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: stray.shop.example
---
