# Each Ingress asks for one thing not translated yet, or one Kubernetes would not have
# taken, and is left out whole, even the parts it could have had; the one that asks for
# nothing more is translated beside them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: a-tls-without-hosts, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ secretName: shop-tls }]
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: a2-tls-without-secret, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ hosts: [shop.example.com] }]
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: b-neither-rules-nor-default-backend, namespace: shop }
spec:
  ingressClassName: edge
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: c-prefix-without-path, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
          - { pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: c2-unknown-path-type, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Regex, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: c3-rule-without-paths, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: f-backend-without-port, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
          - { path: /bare, pathType: Prefix, backend: { service: { name: web } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: h-external-name, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: elsewhere, port: { number: 443 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: i-resource, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { resource: { apiGroup: example.com, kind: Bucket, name: assets } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i2-annotated
  namespace: shop
  annotations: { nginx.ingress.kubernetes.io/rewrite-target: / }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: j-good
  namespace: shop
  # kubectl's record of what it applied says nothing of routing: it does not leave an
  # Ingress out.
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"kind":"Ingress"}'
spec:
  ingressClassName: edge
  rules:
    - host: good.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k-class-by-annotation
  namespace: shop
  annotations: { kubernetes.io/ingress.class: edge }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: elsewhere, namespace: shop }
spec:
  type: ExternalName
  externalName: api.example.net
  ports: [{ port: 443 }]
