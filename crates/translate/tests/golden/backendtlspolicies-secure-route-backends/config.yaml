listeners:
  port-8080:
    address: 0.0.0.0:8080
    protocol: http
    forwarding:
      trusted_proxies: []
      trusted_only_headers:
      - Forwarded
      - X-Real-IP
      - X-Forwarded-*
    request_id: generate
    proxy_protocol: 'off'
  port-9000:
    address: 0.0.0.0:9000
    protocol: tcp
    proxy_protocol: 'off'
routes:
- name: grpcroute/shop/calls/http
  listeners:
  - port-8080
  hostnames:
  - name: calls.example.com
    falls_through: false
  rules:
  - matches:
    - path:
        prefix: /
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/api/https/h2
        weight: 1
    rate_limits: []
  rate_limits: []
- name: httproute/shop/pages/http
  listeners:
  - port-8080
  hostnames:
  - name: shop.example.com
    falls_through: false
  rules:
  - matches:
    - path:
        prefix: /fast
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/fast/secure
        weight: 1
    rate_limits: []
  - matches:
    - path:
        prefix: /api
      headers: []
      query: []
    filters: []
    forward:
      backends:
      - upstream: shop/api/https
        weight: 1
    rate_limits: []
  - matches:
    - path:
        prefix: /
      headers: []
      query: []
    filters:
    - type: request_mirror
      upstream: shop/mirror/https
      fraction:
        numerator: 1
        denominator: 1
    forward:
      backends:
      - upstream: shop/web/https
        weight: 1
    rate_limits: []
  rate_limits: []
tcp_routes:
- name: tcproute/shop/carried/raw
  listeners:
  - port-9000
  backends:
  - upstream: shop/web/https/tcp
    weight: 1
tls_routes: []
upstreams:
  shop/api/https:
    endpoints:
      kubernetes: api.shop.svc.cluster.local:https
    protocol: http1
    tls:
