apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: mirror, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: fast, namespace: shop }
spec:
  ports: [{ name: secure, port: 8443, appProtocol: kubernetes.io/h2c }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
