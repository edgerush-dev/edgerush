# BackendTLSPolicies over the Services routes reach: an HTTPRoute's backend and its
# mirror's, of one policy of three targets, spoken to in HTTP/1.1 over TLS, the policy's
# hostname the SNI and the name checked, its ConfigMap's CA trusted; a port of
# kubernetes.io/h2c in HTTP/2 over TLS; a Service that both an HTTPRoute and a GRPCRoute
# reach, over HTTP/1.1 and HTTP/2 over TLS, the latter named apart, its subject alternative
# names checked in place of its hostname; and a TCPRoute's backend of a covered port, carried
# as it comes, named apart from the upstream over TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
    - { name: raw, port: 9000, protocol: TCP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: http }]
  hostnames: [shop.example.com]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /fast } }]
      backendRefs: [{ name: fast, port: 8443 }]
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: api, port: 443 }]
    - filters:
        - type: RequestMirror
          requestMirror: { backendRef: { name: mirror, port: 443 } }
      backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: { name: calls, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: http }]
  hostnames: [calls.example.com]
  rules:
    - backendRefs: [{ name: api, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata: { name: carried, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: raw }]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: tls, namespace: shop }
spec:
  targetRefs:
    - { group: "", kind: Service, name: web }
    - { group: "", kind: Service, name: mirror }
    - { group: "", kind: Service, name: fast }
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: web.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: api-tls, namespace: shop }
spec:
  targetRefs: [{ group: "", kind: Service, name: api }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: api.shop.example
    subjectAltNames:
      - { type: Hostname, hostname: "*.api.shop.example" }
      - { type: URI, uri: "spiffe://cluster.local/ns/shop/sa/api" }
---
