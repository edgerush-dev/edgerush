# BackendTLSPolicies over an Ingress's backends, as over a route's: a covered port reached
# over TLS as the policy asks, the same upstream as the HTTPRoute's to it; a covered
# kubernetes.io/wss port by the policy's CA and hostname in place of the data plane's
# backend_authorities and the Service's name; a wss port no policy covers as ever; and a
# path to a port whose policy fails, answered 500.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web }]
  hostnames: [route.example.com]
  rules:
    - backendRefs: [{ name: web, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 443 } } } }
          - { path: /chat, pathType: Prefix, backend: { service: { name: chat, port: { name: wss } } } }
          - { path: /plain-chat, pathType: Prefix, backend: { service: { name: plain-chat, port: { name: wss } } } }
          - { path: /failing, pathType: Prefix, backend: { service: { name: failing, port: { number: 443 } } } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: tls, namespace: shop }
spec:
  targetRefs:
    - { group: "", kind: Service, name: web }
    - { group: "", kind: Service, name: chat }
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: web.shop.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: failing, namespace: shop }
spec:
  targetRefs: [{ group: "", kind: Service, name: failing }]
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: not-there }]
    hostname: failing.shop.example
---
