apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: chat, namespace: shop }
spec:
  ports: [{ name: wss, port: 443, appProtocol: kubernetes.io/wss }]
---
apiVersion: v1
kind: Service
metadata: { name: plain-chat, namespace: shop }
spec:
  ports: [{ name: wss, port: 443, appProtocol: kubernetes.io/wss }]
---
apiVersion: v1
kind: Service
metadata: { name: failing, namespace: shop }
spec:
  ports: [{ name: https, port: 443 }]
