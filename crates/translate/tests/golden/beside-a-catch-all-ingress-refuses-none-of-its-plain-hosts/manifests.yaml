# Ingress's HTTPS port is shared with a Gateway listener of no hostname presenting a
# certificate, which answers every name no other does: Ingress refuses there none of the
# hosts it serves over plain HTTP alone, which that listener then serves, and that is said.
# A host the Ingress asked to secure with a Secret that is not there stays refused, as it
# is never served with another certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - name: all
      port: 443
      protocol: HTTPS
      tls: { certificateRefs: [{ name: wild }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  tls: [{ hosts: [broken.example.com], secretName: gone }]
  rules:
    - host: plain.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: broken.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
