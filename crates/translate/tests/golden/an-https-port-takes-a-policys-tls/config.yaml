listeners:
  port-8080:
    address: 0.0.0.0:8080
    protocol: http
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, X-Forwarded-*] }
    request_id: generate
    proxy_protocol: 'off'
routes:
  - name: grpcroute/shop/calls/http
    listeners: [port-8080]
    hostnames: [{ name: calls.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ invalid: "Service shop/upper port btls has appProtocol HTTPS; a GRPCRoute's backend is spoken to in HTTP/2 in the clear, on a port of none or of kubernetes.io/h2c, grpc or http2", weight: 1 }] }
  - name: httproute/shop/pages/http
    listeners: [port-8080]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /upper } }]
        forward: { backends: [{ upstream: shop/upper/btls, weight: 1 }] }
      - matches: [{ path: { prefix: /lower } }]
        forward: { backends: [{ upstream: shop/lower/btls, weight: 1 }] }
      - matches: [{ path: { prefix: /uncovered } }]
        forward: { backends: [{ invalid: "Service shop/uncovered port btls has appProtocol HTTPS, and no BackendTLSPolicy covers it to say how its TLS is had", weight: 1 }] }
