apiVersion: v1
kind: Service
metadata: { name: upper, namespace: shop }
spec:
  ports: [{ name: btls, port: 443, appProtocol: HTTPS }]
---
apiVersion: v1
kind: Service
metadata: { name: lower, namespace: shop }
spec:
  ports: [{ name: btls, port: 443, appProtocol: https }]
---
apiVersion: v1
kind: Service
metadata: { name: uncovered, namespace: shop }
spec:
  ports: [{ name: btls, port: 443, appProtocol: HTTPS }]
