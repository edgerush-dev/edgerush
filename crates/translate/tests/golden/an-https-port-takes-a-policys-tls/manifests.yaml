# A port whose appProtocol is https, of any case, is HTTP/1.1 over TLS: where a
# BackendTLSPolicy covers it, an HTTPRoute's backend there is spoken to over TLS as the
# policy asks, as one of no appProtocol is; where none covers it, the gateway cannot say
# how its TLS is had and the backend is invalid, never spoken to in the clear; and a
# GRPCRoute's, which is spoken to in HTTP/2, cannot be one of https, covered or not.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: http }]
  hostnames: [shop.example.com]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /upper } }]
      backendRefs: [{ name: upper, port: 443 }]
    - matches: [{ path: { type: PathPrefix, value: /lower } }]
      backendRefs: [{ name: lower, port: 443 }]
    - matches: [{ path: { type: PathPrefix, value: /uncovered } }]
      backendRefs: [{ name: uncovered, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata: { name: calls, namespace: shop }
spec:
  parentRefs: [{ name: web, sectionName: http }]
  hostnames: [calls.example.com]
  rules:
    - backendRefs: [{ name: upper, port: 443 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata: { name: tls, namespace: shop }
spec:
  targetRefs:
    - { group: "", kind: Service, name: upper }
    - { group: "", kind: Service, name: lower }
  validation:
    caCertificateRefs: [{ group: "", kind: ConfigMap, name: ca }]
    hostname: web.shop.example
---
