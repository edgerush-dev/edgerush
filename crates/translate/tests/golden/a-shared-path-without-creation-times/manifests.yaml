# Two Ingresses with one path on one host, only one of them carrying its creation time, as
# manifests written by hand do not: they are ranked by name, which may not be the
# cluster's order, so the clash is said without saying which takes the path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: a, namespace: shop, creationTimestamp: "2026-10-01T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: b, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
