# Routes come oldest first, then by namespace and name, whatever order the objects came
# in; an Ingress's hosts are a route each, and an upstream two Ingresses share is one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: newer, namespace: shop, creationTimestamp: "2026-10-02T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: b.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: a.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: older, namespace: shop, creationTimestamp: "2026-10-01T00:00:00Z" }
spec:
  ingressClassName: edge
  rules:
    - host: c.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
