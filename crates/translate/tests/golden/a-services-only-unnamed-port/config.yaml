listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/api/api.example.com
    listeners: [http]
    hostnames: [{ name: api.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /v1 } }]
        forward: { backends: [{ upstream: shop/api/8080, weight: 1 }] }
upstreams:
  shop/api/8080: { load_balancer: p2c, endpoints: { kubernetes: "api.shop.svc.cluster.local:8080" } }
