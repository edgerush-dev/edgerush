# Beside rules, the default backend takes what none of them does on the Ingress's own
# hosts: a `/` path on each, ranked below its own paths. A host whose rules have their own
# `/` keeps it; a host named without paths is the default backend's alone; hosts the
# Ingress does not name are not its. A default backend that is not there is answered 500.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  defaultBackend: { service: { name: fallback, port: { number: 80 } } }
  rules:
    - host: a.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: b.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: c.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: gone, namespace: shop }
spec:
  ingressClassName: edge
  defaultBackend: { service: { name: gone, port: { number: 80 } } }
  rules:
    - host: d.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: fallback, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
