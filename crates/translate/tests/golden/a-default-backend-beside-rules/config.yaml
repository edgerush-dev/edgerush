listeners:
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
routes:
  - name: ingress/shop/gone/d.example.com
    listeners: [port-80]
    hostnames: [{ name: d.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /api } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ invalid: "Service shop/gone does not exist", weight: 1 }] }
  - name: ingress/shop/web/a.example.com
    listeners: [port-80]
    hostnames: [{ name: a.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: /api } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/fallback/http, weight: 1 }] }
  - name: ingress/shop/web/b.example.com
    listeners: [port-80]
    hostnames: [{ name: b.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/c.example.com
    listeners: [port-80]
    hostnames: [{ name: c.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/fallback/http, weight: 1 }] }
upstreams:
  shop/fallback/http: { load_balancer: p2c, endpoints: { kubernetes: "fallback.shop.svc.cluster.local:http" } }
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
