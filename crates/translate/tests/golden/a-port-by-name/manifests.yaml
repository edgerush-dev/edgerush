# A backend names the port; the Service has two, and two paths of one host lead to each.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: app, namespace: shop }
spec:
  ingressClassName: edge
  rules:
    - host: app.example.com
      http:
        paths:
          - { path: /admin, pathType: Prefix, backend: { service: { name: app, port: { name: admin } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: app, port: { name: http } } } }
---
apiVersion: v1
kind: Service
metadata: { name: app, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }, { name: admin, port: 9000 }]
