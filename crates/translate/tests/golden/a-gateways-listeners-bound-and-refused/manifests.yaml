# Each of the Gateway's listeners as the data plane can serve it, or why it cannot: each
# port is bound once, however many listeners state it; of two listeners stating one port
# for two protocols, the first takes the port for its own and the later is refused;
# a protocol never taken is refused; an HTTPS listener of no certificate is
# accepted, serving nothing, its port bound and refusing every handshake until it has one;
# of two that cannot be told apart, the first is served and the later refused, and one
# beside them that differs by its hostname alone is served.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: edge }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP }
    - { name: elsewhere, port: 9000, protocol: HTTP }
    - { name: plain-on-secure, port: 8443, protocol: HTTP }
    - { name: secure, port: 8443, protocol: HTTPS }
    - { name: unsigned, port: 8444, protocol: HTTPS }
    - { name: sctp, port: 53, protocol: SCTP }
    - { name: first, port: 8080, protocol: HTTP, hostname: a.example.com }
    - { name: second, port: 8080, protocol: HTTP, hostname: a.example.com }
    - { name: apart, port: 8080, protocol: HTTP, hostname: b.example.com }
