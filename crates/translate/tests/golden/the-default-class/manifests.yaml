# The data plane's class is the cluster's default: an Ingress of no class is its, and one of
# another class is not.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: main
  annotations: { ingressclass.kubernetes.io/is-default-class: "true" }
spec: { controller: edgerush.dev/ingress-controller }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: theirs, namespace: shop }
spec:
  ingressClassName: other
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
