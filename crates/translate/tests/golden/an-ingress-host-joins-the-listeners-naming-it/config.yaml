listeners:
  port-443:
    address: "0.0.0.0:443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/wild, names: [secure.example.com, plain.example.com] }
        - { certificate: shop/shop-tls, names: [shop.example.com] }
      without_sni: none
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-8080:
    address: "0.0.0.0:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-8443:
    address: "0.0.0.0:8443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/wild, names: [shop.example.com] }
      without_sni: none
routes:
  - name: ingress/shop/web/plain.example.com
    listeners: [port-80, port-443]
    hostnames: [{ name: plain.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/secure.example.com
    listeners: [port-443]
    hostnames: [{ name: secure.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/secure.example.com/https-redirect
    listeners: [port-80]
    hostnames: [{ name: secure.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=30" }] }]
        redirect: { status: 308, scheme: https, query: keep }
  - name: ingress/shop/web/shop.example.com
    listeners: [port-443, port-8443]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/web/shop.example.com/https-redirect
    listeners: [port-80, port-8080]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=30" }] }]
        redirect: { status: 308, scheme: https, query: keep }
  - { name: gateway/shop/web/shop-alt, listeners: [port-8080], hostnames: [{ name: shop.example.com, falls_through: false }], rules: [] }
  - { name: gateway/shop/web/shop-secure, listeners: [port-8443], hostnames: [{ name: shop.example.com, falls_through: false }], rules: [] }
  - { name: gateway/shop/web/secure, listeners: [port-443], hostnames: [{ name: secure.example.com, falls_through: false }], rules: [] }
  - { name: gateway/shop/web/plain, listeners: [port-443], hostnames: [{ name: plain.example.com, falls_through: false }], rules: [] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
