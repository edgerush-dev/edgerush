# An Ingress host joins each Gateway listener naming it, as well as being served on
# Ingress's own ports. shop.example.com, named on 8080 and 8443, is served there too, its
# redirect on 8080 as on 80, with the listener's certificate on 8443 and its own Secret on
# 443. secure.example.com, named on 443, Ingress's HTTPS port, is served there with the
# listener's certificate, its own Secret passed over, and said. plain.example.com, which
# the Ingress serves over plain HTTP alone, named on 443, is served over HTTPS there too,
# no longer refused, and said.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: shop }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: shop-alt, port: 8080, protocol: HTTP, hostname: shop.example.com }
    - name: shop-secure
      port: 8443
      protocol: HTTPS
      hostname: shop.example.com
      tls: { certificateRefs: [{ name: wild }] }
    - name: secure
      port: 443
      protocol: HTTPS
      hostname: secure.example.com
      tls: { certificateRefs: [{ name: wild }] }
    - name: plain
      port: 443
      protocol: HTTPS
      hostname: plain.example.com
      tls: { certificateRefs: [{ name: wild }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web, namespace: shop }
spec:
  ingressClassName: edge
  tls:
    - { hosts: [shop.example.com], secretName: shop-tls }
    - { hosts: [secure.example.com], secretName: secure }
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: secure.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: plain.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }]
