# The data plane, as the Gateway edge/web: `http`, and two `https` listeners naming no
# certificate of their own.
ingress_class: edge
gateway: edge/web
cluster_domain: cluster.local
ingress_hosts_fall_through: false
ingress_https_redirect: true
ingress_https_redirect_max_age: 30
listeners:
  http:
    address: "[::]:8080"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  https:
    address: "[::]:8443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls: { certificates: [], without_sni: none }
  more:
    address: "[::]:9443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls: { certificates: [], without_sni: none }
