listeners:
  port-443:
    address: "0.0.0.0:443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: shop/shop-tls, names: ["*"] }
        - { certificate: edge/own, names: [secure.example.com, kinds.example.com, plain.example.com] }
        - { certificate: shop/secure, names: [secure.example.com, later.example.com] }
        - { certificate: shop/wild, names: ["*.wild.example.com", legacy.example.com] }
        - { certificate: shop/ingress-only, names: [shop.example.com] }
      without_sni: shop/shop-tls
      refused: [unusable.example.com, denied.example.com]
  port-80:
    address: "0.0.0.0:80"
    protocol: http
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
  port-9443:
    address: "0.0.0.0:9443"
    protocol: https
    proxy_protocol: off
    forwarding: { trusted_proxies: [], trusted_only_headers: [Forwarded, X-Real-IP, "X-Forwarded-*"] }
    request_id: generate
    tls:
      certificates:
        - { certificate: edge/own, names: [more.example.com] }
      without_sni: none
routes:
  - name: httproute/shop/app/catch-all
    listeners: [port-443]
    hostnames: [{ name: app.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/legacy/shop.example.com
    listeners: [port-443]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/legacy/shop.example.com/https-redirect
    listeners: [port-80]
    hostnames: [{ name: shop.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=30" }] }]
        redirect: { status: 308, scheme: https, query: keep }
  - name: ingress/shop/plain/plain.example.com
    listeners: [port-80]
    hostnames: [{ name: plain.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/shared/legacy.example.com
    listeners: [port-443]
    hostnames: [{ name: legacy.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        forward: { backends: [{ upstream: shop/web/http, weight: 1 }] }
  - name: ingress/shop/shared/legacy.example.com/https-redirect
    listeners: [port-80]
    hostnames: [{ name: legacy.example.com, falls_through: false }]
    rules:
      - matches: [{ path: { prefix: / } }]
        filters: [{ type: response_header_modifier, set: [{ name: cache-control, value: "max-age=30" }] }]
        redirect: { status: 308, scheme: https, query: keep }
  - { name: gateway/edge/web/exact, listeners: [port-443], hostnames: [{ name: secure.example.com, falls_through: false }], rules: [] }
  - { name: gateway/edge/web/wild, listeners: [port-443], hostnames: [{ name: "*.wild.example.com", wildcard: any_labels, falls_through: false }], rules: [] }
  - { name: gateway/edge/web/kinds, listeners: [port-443], hostnames: [{ name: kinds.example.com, falls_through: false }], rules: [] }
  - { name: gateway/edge/web/later, listeners: [port-443], hostnames: [{ name: later.example.com, falls_through: false }], rules: [] }
  - { name: gateway/edge/web/migrated, listeners: [port-443], hostnames: [{ name: plain.example.com, falls_through: false }], rules: [] }
  - { name: gateway/edge/web/elsewhere, listeners: [port-9443], hostnames: [{ name: more.example.com, falls_through: false }], rules: [] }
upstreams:
  shop/web/http: { load_balancer: p2c, endpoints: { kubernetes: "web.shop.svc.cluster.local:http" } }
