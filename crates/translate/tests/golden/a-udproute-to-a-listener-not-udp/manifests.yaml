# A UDPRoute naming a listener that is not UDP, by sectionName or by port, is not allowed
# there, as conformance has it (UDPRouteNotAllowedByListeners), its HTTPRoute neighbour
# served all the same; one naming another Gateway is not said.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: edgerush }
spec:
  controllerName: edgerush.dev/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: web, namespace: edge }
spec:
  gatewayClassName: edgerush
  listeners:
    - { name: http, port: 8080, protocol: HTTP, allowedRoutes: { namespaces: { from: All } } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata: { name: dns, namespace: shop }
spec:
  parentRefs: [{ name: web, namespace: edge, sectionName: http }]
  rules:
    - backendRefs: [{ name: web, port: 53 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata: { name: by-port, namespace: shop }
spec:
  parentRefs: [{ name: web, namespace: edge, port: 8080 }]
  rules:
    - backendRefs: [{ name: web, port: 53 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata: { name: elsewhere, namespace: shop }
spec:
  parentRefs: [{ name: other, namespace: edge }]
  rules:
    - backendRefs: [{ name: web, port: 53 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: pages, namespace: shop }
spec:
  parentRefs: [{ name: web, namespace: edge }]
  hostnames: [shop.example.com]
  rules:
    - backendRefs: [{ name: web, port: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  ports: [{ name: http, port: 80 }, { name: dns, port: 53, protocol: UDP }]
