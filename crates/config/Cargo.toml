[package]
name = "edgerush-config"
description = "EdgeRush config model: what a data plane runs, and its compilation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The JSON Schema of the config file (`HarnessFile::schema`), for the binary's test that
# keeps `schema/config.schema.json` as the types say.
schema = ["dep:schemars"]

[dependencies]
edgerush-filters.workspace = true
edgerush-router.workspace = true
http.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
iai-callgrind.workspace = true
proptest.workspace = true
# Fixtures are written the way harness files are. The crate itself knows no format.
serde-saphyr.workspace = true

[[bench]]
name = "backends"
harness = false

[lints]
workspace = true
