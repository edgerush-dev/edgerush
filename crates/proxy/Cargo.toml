[package]
name = "edgerush-proxy"
description = "EdgeRush data plane: the request core, and around it the only code that touches the HTTP engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opens the upstream codec to the fuzz targets, which are a package of their own. Nothing
# in EdgeRush turns this on, and the workspace's checks never build with it.
# A stopped clock is what makes a scripted run deterministic, and it is `test-util`
# that lets anything but a test stop one.
fuzzing = ["tokio/test-util"]

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
edgerush-config.workspace = true
edgerush-router.workspace = true
edgerush-telemetry.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper.workspace = true
hyper-util.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
iai-callgrind.workspace = true
proptest.workspace = true
# Fixtures are written the way harness files are.
serde-saphyr.workspace = true
# "test-util" is what lets a test move the clock itself, so a test of a minute-long
# deadline takes no time at all.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "test-util",
] }

[[bench]]
name = "decide"
harness = false

[[bench]]
name = "h1_codec"
harness = false
required-features = ["fuzzing"]

[lints]
workspace = true
