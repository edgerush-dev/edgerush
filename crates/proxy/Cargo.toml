[package]
name = "edgerush-proxy"
description = "EdgeRush data plane: the request core, and around it the only code that touches the HTTP engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opens the upstream codec to the fuzz targets, which are a package of their own. Nothing
# in EdgeRush turns this on, and the workspace's checks never build with it.
# A stopped clock is what makes a scripted run deterministic, and it is `test-util`
# that lets anything but a test stop one. hyper's client is the second oracle the
# differential target holds EdgeRush's own client against, and the only reason hyper is
# built outside the tests.
fuzzing = ["tokio/test-util", "dep:hyper", "dep:hyper-util", "hyper/client"]
# HTTP/0.9 over QUIC (`hq-interop`) beside HTTP/3, which quic-interop-runner's transport
# cases speak: for the interop image only, never a release (16 §8).
interop = []

[dependencies]
arc-swap.workspace = true
boring.workspace = true
bytes.workspace = true
edgerush-certificates.workspace = true
edgerush-config.workspace = true
# Which of a Service's EndpointSlices' endpoints take requests.
edgerush-discovery.workspace = true
edgerush-filters.workspace = true
# Rules' rate limits (experimental): each worker a data plane of the rate-limiting
# service's protocol, reaching the service through that crate's gRPC client.
edgerush-ratelimit.workspace = true
edgerush-ratelimit-service.workspace = true
edgerush-router.workspace = true
edgerush-rules.workspace = true
edgerush-telemetry.workspace = true
h2.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper = { workspace = true, optional = true }
# The EndpointSlices of namespaces followed, as the API gives them.
k8s-openapi.workspace = true
hyper-util = { workspace = true, optional = true }
memchr.workspace = true
quiche.workspace = true
thiserror.workspace = true
# "sync": what an HTTP/2 upstream connection and its requests wait on each other with.
tokio = { workspace = true, features = ["sync"] }
tokio-boring.workspace = true

# Sending a run of QUIC datagrams in one call for the kernel to cut apart (UDP GSO), which
# needs a control message that neither std nor tokio can send; and, for a wildcard HTTP/3
# bind, reading a datagram's real destination and replying from it (IP_PKTINFO, via `nix`).
[target.'cfg(target_os = "linux")'.dependencies]
socket2.workspace = true
nix.workspace = true

[dev-dependencies]
# Certificates made on the spot, for listeners and upstreams under test.
edgerush-certificates = { workspace = true, features = ["testing"] }
# The engine's clients and its either-version server, for tests only: what talks to the
# proxy as a client would, upstreams that speak both versions, and a second oracle for
# EdgeRush's own HTTP/1 client (`upstream::h1::differential`).
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client-legacy", "server-auto", "service"] }
iai-callgrind.workspace = true
proptest.workspace = true
# A real gRPC client and server, for the acceptance tests of the four call shapes
# (`tests/grpc_calls.rs`): payloads stay bytes, so no protobuf, and no router.
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tower-service = "0.3"
# Fixtures are written the way harness files are.
serde-saphyr.workspace = true
# Access-log records read back as what they are, JSON.
serde_json.workspace = true
# "test-util" is what lets a test move the clock itself, so a test of a minute-long
# deadline takes no time at all.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "test-util",
] }

