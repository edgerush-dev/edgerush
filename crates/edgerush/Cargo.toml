[package]
name = "edgerush"
description = "EdgeRush: a Kubernetes-native API gateway (operator, control plane and data plane in one binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The quic-interop-runner image's build: its listeners speak HTTP/0.9 over QUIC as well.
interop = ["edgerush-proxy/interop"]

[dependencies]
edgerush-config.workspace = true
# The config stream `edgerush controller` serves, and the offers it sends.
edgerush-control-service.workspace = true
edgerush-control-stream.workspace = true
edgerush-controller.workspace = true
edgerush-explain.workspace = true
# The cluster's API server, found as a pod finds it, which discovered upstreams are
# followed through.
edgerush-kubernetes.workspace = true
edgerush-proxy.workspace = true
edgerush-translate.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
# "serialize": the config the control plane writes with `--write-config`.
serde-saphyr = { workspace = true, features = ["serialize"] }
socket2.workspace = true
thiserror.workspace = true
# "sync": the channels by which a worker is handed a connection. "signal": being told to
# stop, which starts the drain. Every worker runs a single-threaded runtime, so the
# multi-thread one is not built.
tokio = { workspace = true, features = ["signal", "sync"] }

# The open-file limit, raised at the start (03 §9). There is none to raise on Windows.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The stream's certificates, issued by an authority of the tests' own.
edgerush-certificates = { workspace = true, features = ["testing"] }
# Its `schema` feature: `tests/schema.rs` keeps `schema/config.schema.json` as the types say.
edgerush-config = { workspace = true, features = ["schema"] }
# The fake API server `edgerush controller` is run against.
edgerush-kubernetes = { workspace = true, features = ["testing"] }
proptest.workspace = true
schemars.workspace = true
serde_json.workspace = true
# The fake API server answers on a runtime with threads of its own.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
