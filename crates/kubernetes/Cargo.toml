[package]
name = "edgerush-kubernetes"
description = "EdgeRush's client of the Kubernetes API: the list and watch of the kinds it reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake API server (`testing`), for the tests of crates that follow namespaces with this
# one. Never for the binary.
testing = ["dep:edgerush-certificates", "edgerush-certificates/testing"]

[dependencies]
boring.workspace = true
bytes.workspace = true
# The fake API server's certificate, under `testing` alone.
edgerush-certificates = { workspace = true, optional = true }
# HTTP/2, which the data plane already speaks to upstreams: one connection to the API
# server carries every namespace's list and watch, as Kubernetes' own clients do.
# The Gateway API kinds the control plane follows.
edgerush-gateway-api.workspace = true
h2.workspace = true
http.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-boring.workspace = true

[dev-dependencies]
# Certificates made on the spot, for the fake API server.
edgerush-certificates = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
