[package]
name = "edgerush-controller"
description = "EdgeRush's control plane: the cluster's objects followed, translated and compiled for a data plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Each certificate handed out read for its dates, and the gauge of them written (08 §1).
edgerush-certificates.workspace = true
edgerush-config.workspace = true
# The Gateway API kinds followed.
edgerush-gateway-api.workspace = true
edgerush-kubernetes.workspace = true
# The DataPlane the data plane's settings are read from (05 §3).
edgerush-planes.workspace = true
edgerush-telemetry.workspace = true
edgerush-translate.workspace = true
k8s-openapi.workspace = true
# The admission webhook's reviews, read (04 §3).
serde.workspace = true
# Ingress status, written as a JSON merge patch (04 §6), and the webhook's reviews, read
# and answered.
serde_json.workspace = true
thiserror.workspace = true
# "sync": each follow's objects, and the word that one has changed; with the workspace's
# "rt", the follows' tasks, ended with the control plane, and "time", the debounce;
# "macros", the DataPlanes' follow waiting on a change or on no one left to tell.
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
bytes.workspace = true
edgerush-certificates = { workspace = true, features = ["testing"] }
edgerush-kubernetes = { workspace = true, features = ["testing"] }
proptest.workspace = true
serde-saphyr.workspace = true
# The fake API server answers on a runtime with threads of its own.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
