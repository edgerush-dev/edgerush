version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
edgerush-cluster.workspace = true
edgerush-cluster-asynchronous.workspace = true
edgerush-cluster-synchronous.workspace = true

[dev-dependencies]
edgerush-memory.workspace = true
edgerush-ratelimit.workspace = true
iai-callgrind.workspace = true
proptest.workspace = true

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "cycle"
harness = false

[[bench]]
name = "tick"
harness = false

[lints]
workspace = true
