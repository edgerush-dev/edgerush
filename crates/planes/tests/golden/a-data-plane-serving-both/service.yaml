apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-controller
    app.kubernetes.io/name: edgerush
    cost-centre: payments
    gateway.edgerush.dev/control-plane: edge
    gateway.edgerush.dev/control-plane-namespace: edge-system
    gateway.edgerush.dev/data-plane: shared
    gateway.edgerush.dev/namespace: edge-system
  name: edgerush-proxy-shared
  namespace: edge-system
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DataPlane
    name: shared
    uid: 0d6a9f3c-0000-4000-8000-000000000003
spec:
  externalTrafficPolicy: Local
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  loadBalancerSourceRanges:
  - 203.0.113.0/24
  ports:
  - name: port-80
    port: 80
    protocol: TCP
    targetPort: 80
  - name: port-443
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: edge
    gateway.edgerush.dev/data-plane: shared
    gateway.edgerush.dev/namespace: edge-system
  sessionAffinity: None
  type: LoadBalancer
