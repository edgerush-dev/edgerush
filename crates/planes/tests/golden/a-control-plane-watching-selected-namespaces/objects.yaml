apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: payments
    gateway.edgerush.dev/namespace: payments-edge
  name: edgerush-controller-payments
  namespace: payments-edge
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ControlPlane
    name: payments
    uid: 6f1c2b8e-0000-4000-8000-000000000003
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/managed-by: edgerush-operator
      app.kubernetes.io/name: edgerush
      gateway.edgerush.dev/control-plane: payments
      gateway.edgerush.dev/namespace: payments-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/managed-by: edgerush-operator
        app.kubernetes.io/name: edgerush
        gateway.edgerush.dev/control-plane: payments
        gateway.edgerush.dev/namespace: payments-edge
    spec:
      containers:
      - args:
        - controller
        - --control-plane
        - payments
        - --cluster-domain
        - cluster.local
        - --listen
        - 0.0.0.0:9443
        - --leader-lease
        - payments-edge/edgerush-controller-payments
        - --authority
        - payments-ca
        - --authority-provided
        - --namespace-selector
        - team=payments
        - --webhook-listen
        - 0.0.0.0:8443
        env:
        - name: EDGERUSH_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: edgerush:golden
        name: edgerush
        ports:
        - containerPort: 9443
          name: stream
        - containerPort: 8443
          name: webhook
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: edgerush-controller-payments
