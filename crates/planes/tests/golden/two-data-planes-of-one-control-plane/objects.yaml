apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: shop
    gateway.edgerush.dev/data-plane: web
    gateway.edgerush.dev/namespace: shop-edge
  name: edgerush-proxy-web
  namespace: shop-edge
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DataPlane
    name: web
    uid: 0d6a9f3c-0000-4000-8000-000000000005
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: edgerush-operator
      app.kubernetes.io/name: edgerush
      gateway.edgerush.dev/control-plane: shop
      gateway.edgerush.dev/data-plane: web
      gateway.edgerush.dev/namespace: shop-edge
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/managed-by: edgerush-operator
        app.kubernetes.io/name: edgerush
        gateway.edgerush.dev/control-plane: shop
        gateway.edgerush.dev/data-plane: web
        gateway.edgerush.dev/namespace: shop-edge
    spec:
      containers:
      - args:
        - proxy
        - --control-plane
        - edgerush-controller-shop.shop-edge.svc:9443
        - --workers
        - "1"
        - --certificate
        - /etc/edgerush/identity/tls.crt
        - --key
        - /etc/edgerush/identity/tls.key
        - --authorities
        - /etc/edgerush/identity/ca.crt
        env:
        - name: POD_IPS
          valueFrom:
            fieldRef:
              fieldPath: status.podIPs
        image: edgerush:golden
        name: edgerush
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/edgerush/identity
          name: identity
          readOnly: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      serviceAccountName: edgerush-proxy-web
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: edgerush-operator
            app.kubernetes.io/name: edgerush
            gateway.edgerush.dev/control-plane: shop
            gateway.edgerush.dev/data-plane: web
            gateway.edgerush.dev/namespace: shop-edge
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: identity
        secret:
          secretName: edgerush-proxy-web-identity
