    kind: DataPlane
    name: api
    uid: 0d6a9f3c-0000-4000-8000-000000000002
spec:
  maxReplicas: 20
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edgerush-proxy-api
