apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: payments
    gateway.edgerush.dev/data-plane: api
  name: api
  namespace: payments-edge
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DataPlane
    name: api
    uid: 0d6a9f3c-0000-4000-8000-000000000002
spec:
  allowedListeners:
    namespaces:
      from: Same
  gatewayClassName: payments
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: "*.payments.example.com"
    name: wildcard
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: payments-wildcard
      mode: Terminate
  tls:
    frontend:
      default: {}
      perPort:
      - port: 443
        tls:
          validation:
            caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: client-ca
            mode: AllowValidOnly
