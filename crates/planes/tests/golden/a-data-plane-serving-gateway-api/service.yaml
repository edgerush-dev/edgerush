apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-controller
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: payments
    gateway.edgerush.dev/control-plane-namespace: payments-edge
    gateway.edgerush.dev/data-plane: api
    gateway.edgerush.dev/namespace: payments-edge
  name: edgerush-proxy-api
  namespace: payments-edge
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DataPlane
    name: api
    uid: 0d6a9f3c-0000-4000-8000-000000000002
spec:
  externalTrafficPolicy: Local
  ipFamilies:
  - IPv4
  - IPv6
  ipFamilyPolicy: RequireDualStack
  loadBalancerClass: service.k8s.aws/nlb
  ports:
  - name: port-80
    port: 80
    protocol: TCP
    targetPort: 80
  - name: port-443
    port: 443
    protocol: TCP
    targetPort: 443
  - name: port-443-udp
    port: 443
    protocol: UDP
    targetPort: 443
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: payments
    gateway.edgerush.dev/data-plane: api
    gateway.edgerush.dev/namespace: payments-edge
  sessionAffinity: None
  type: LoadBalancer
