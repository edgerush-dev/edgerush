apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: edge
  name: edgerush-controller-edge
  namespace: edge-system
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: ControlPlane
    name: edge
    uid: 6f1c2b8e-0000-4000-8000-000000000002
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/managed-by: edgerush-operator
      app.kubernetes.io/name: edgerush
      gateway.edgerush.dev/control-plane: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/managed-by: edgerush-operator
        app.kubernetes.io/name: edgerush
        gateway.edgerush.dev/control-plane: edge
    spec:
      containers:
      - args:
        - controller
        - --control-plane
        - edge
        - --cluster-domain
        - cluster.local
        - --listen
        - 0.0.0.0:9443
        - --leader-lease
        - edge-system/edgerush-controller-edge
        env:
        - name: EDGERUSH_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: edgerush:golden
        name: edgerush
        ports:
        - containerPort: 9443
          name: stream
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: edgerush-controller-edge
