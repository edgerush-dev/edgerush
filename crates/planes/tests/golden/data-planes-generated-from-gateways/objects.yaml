apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    example.com/owner: shop
    service.beta.kubernetes.io/aws-load-balancer-type: external
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: edgerush-operator
    app.kubernetes.io/name: edgerush
    gateway.edgerush.dev/control-plane: edge
    gateway.edgerush.dev/data-plane: web-edge
    gateway.edgerush.dev/namespace: shop
    gateway.networking.k8s.io/gateway-class-name: edge
    gateway.networking.k8s.io/gateway-name: web
    team: shop
  name: edgerush-proxy-web-edge
  namespace: shop
  ownerReferences:
  - apiVersion: gateway.edgerush.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DataPlane
    name: web-edge
    uid: uid-of-web-edge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: edgerush-operator
      app.kubernetes.io/name: edgerush
      gateway.edgerush.dev/control-plane: edge
      gateway.edgerush.dev/data-plane: web-edge
      gateway.edgerush.dev/namespace: shop
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        example.com/owner: shop
        service.beta.kubernetes.io/aws-load-balancer-type: external
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/managed-by: edgerush-operator
        app.kubernetes.io/name: edgerush
        gateway.edgerush.dev/control-plane: edge
        gateway.edgerush.dev/data-plane: web-edge
        gateway.edgerush.dev/namespace: shop
        gateway.networking.k8s.io/gateway-class-name: edge
        gateway.networking.k8s.io/gateway-name: web
        team: shop
    spec:
      containers:
      - args:
        - proxy
        - --control-plane
        - edgerush-controller-edge.edge-system.svc:9443
        - --workers
        - "1"
        - --certificate
        - /etc/edgerush/identity/tls.crt
        - --key
        - /etc/edgerush/identity/tls.key
        - --authorities
        - /etc/edgerush/identity/ca.crt
        env:
        - name: POD_IPS
          valueFrom:
            fieldRef:
              fieldPath: status.podIPs
        image: edgerush:golden
        name: edgerush
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/edgerush/identity
          name: identity
          readOnly: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      serviceAccountName: edgerush-proxy-web-edge
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: edgerush-operator
            app.kubernetes.io/name: edgerush
            gateway.edgerush.dev/control-plane: edge
            gateway.edgerush.dev/data-plane: web-edge
            gateway.edgerush.dev/namespace: shop
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: identity
        secret:
          secretName: edgerush-proxy-web-edge-identity
---
