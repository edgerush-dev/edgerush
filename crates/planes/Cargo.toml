[package]
name = "edgerush-planes"
description = "EdgeRush's ControlPlane and DataPlane kinds, the roles the install ships, and the objects the operator makes for them; no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The Gateway and GatewayClass made, of Gateway API's own types.
edgerush-gateway-api.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
# The DataPlane's `gateway`, of the Gateway's schema, read as the Gateway's spec.
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
edgerush-crdgen = { path = "../crdgen" }
# The classes made name the controllers translation serves.
edgerush-translate.workspace = true
proptest.workspace = true
# The CRDs are YAML, as the install ships them, and the Gateway's own fields are written
# into the DataPlane's as YAML.
serde-saphyr = { workspace = true, features = ["serialize"] }

[lints]
workspace = true
