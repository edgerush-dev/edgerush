# EdgeRush's RateLimitPolicy, as the install ships it. Written by hand, but for two copies
# made by crates/planes/tests/generated.rs, which fails where they differ: each limit, the
# DataPlane's own `spec.rateLimiting.global` item, from its CRD; and `status`, Gateway API's
# PolicyStatus (GEP-713), from its BackendTLSPolicy CRD. The Rust types are written from
# it, never the other way about.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    gateway.networking.k8s.io/policy: Inherited
  name: ratelimitpolicies.gateway.edgerush.dev
spec:
  group: gateway.edgerush.dev
  names:
    categories:
    - edgerush
    kind: RateLimitPolicy
    listKind: RateLimitPolicyList
    plural: ratelimitpolicies
    singular: ratelimitpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RateLimitPolicy adds rate limits to what its targets serve, and may remove less
          specific ones by name. A request is under the limits of its DataPlane's
          `rateLimiting.global` and of every policy on its Gateway, its listener, its
          ListenerSet and that one's listener, its route or Ingress, and its rule, charged
          to all of them or to none, less those a more specific policy ignores. A route's
          and a rule's policies follow the objects: a request is never under a sibling
          rule's, whatever its paths.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is where the policy applies, the limits it adds and those it removes.
            properties:
              ignore:
                description: |-
                  Ignore is the names of limits less specific than its targets that their
                  requests are not under: the DataPlane's, and those of policies on a less
                  specific level (a Gateway is less specific than its listeners, a route than
                  its rules). ["*"], alone, ignores them all, those added later included. A
                  name not there is no fault; a limit of the same level or a more specific one
                  is never ignored. Empty, as left out, it ignores none.
                items:
                  maxLength: 253
                  minLength: 1
                  pattern: ^[ -~]+$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: '"*" ignores every less specific limit, and stands alone'
                  rule: '!self.exists(name, name == ''*'') || self.size() == 1'
              limits:
                description: |-
                  Limits is the limits the policy adds, each written as a DataPlane's
                  `rateLimiting.global` limit is, and each counted once across all of its
                  targets. A limit's name is unique across the data plane: a change that
                  brings a name another policy holds is refused whole, and the policy goes on
                  as it was last accepted. Empty, as left out, it adds none.
                items:
                  # The DataPlane's limit, copied by the test; not to be edited.
                  description: Limit is one limit, whose requests it counts together and how many it allows.
                  properties:
                    dryRun:
                      description: |-
                        DryRun counts and reports, never refusing: a request it has no room
                        for goes on, and is not charged.
                      type: boolean
                    key:
                      description: |-
                        Key is whose requests are counted together:
                        
                        * Client: the client's address, as the port's forwarding works it out, an IPv6 client by its /64.
                      enum:
                      - Client
                      type: string
                    match:
                      description: Match is the requests it applies to; every request when left out.
                      properties:
                        methods:
                          description: Methods is the methods it applies to, in capitals; any when left out.
                          items:
                            maxLength: 32
                            pattern: ^[A-Z]+$
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                        pathPrefix:
                          description: PathPrefix is the start of the paths it applies to.
                          maxLength: 1024
                          pattern: ^/
                          type: string
                      type: object
                    model:
                      description: Model is how it counts requests, one of its fields given.
                      properties:
                        bucket:
                          description: |-
                            Bucket is a token bucket: requests at Rate on average, at most Burst
                            at once.
                          properties:
                            burst:
                              description: Burst is how many requests a client can send at once, from idle.
                              format: int64
                              minimum: 1.0
                              type: integer
                            rate:
                              description: >-
                                Rate is requests a second, minute, hour or day, on average, such as 100/s,
                                1000/min, 10/h or 500/d.
                              maxLength: 32
                              pattern: ^[1-9][0-9]*/(s|min|h|d)$
                              type: string
                          required:
                          - burst
                          - rate
                          type: object
                        fixedWindow:
                          description: |-
                            FixedWindow is at most Limit requests in each Window, the count
                            starting again as each ends: a whole window's worth may come at once.
                          properties:
                            limit:
                              description: Limit is requests a window.
                              format: int64
                              minimum: 1.0
                              type: integer
                            window:
                              description: Window is a whole number and ms, s, m, h or d, such as 500ms, 1m or 1d.
                              maxLength: 32
                              pattern: ^[1-9][0-9]*(ms|s|m|h|d)$
                              type: string
                          required:
                          - limit
                          - window
                          type: object
                        rollingWindow:
                          description: |-
                            RollingWindow is at most Limit requests in any span of Window, each
                            counted in one of Slots slots a window: room comes back up to a slot
                            early, never late.
                          properties:
                            limit:
                              description: Limit is requests in any window.
                              format: int64
                              minimum: 1.0
                              type: integer
                            slots:
                              description: |-
                                Slots is the slots a window is counted in, 1,000 unless said:
                                fewer bring room back sooner, and each key holds a count for
                                every slot.
                              format: int64
                              maximum: 1000.0
                              minimum: 2.0
                              type: integer
                            window:
                              description: Window is a whole number and ms, s, m, h or d, such as 500ms, 1m or 1d.
                              maxLength: 32
                              pattern: ^[1-9][0-9]*(ms|s|m|h|d)$
                              type: string
                          required:
                          - limit
                          - window
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: one of bucket, fixedWindow and rollingWindow must be given, and only one
                        rule: "[has(self.bucket), has(self.fixedWindow), has(self.rollingWindow)].filter(given, given).size() == 1"
                    name:
                      description: |-
                        Name is the limit's, unique among them: what its counts are kept
                        under, so that they go on through a change that leaves the limit as
                        it was, and what the RateLimit header of a request it refuses calls
                        it. Printable ASCII.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[ -~]+$
                      type: string
                  required:
                  - key
                  - model
                  - name
                  type: object
                  # End of the DataPlane's limit.
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              targetRefs:
                description: |-
                  TargetRefs is what the policy applies to, in its own namespace: Gateways,
                  ListenerSets, HTTPRoutes and GRPCRoutes, or Ingresses, each whole or, with a
                  sectionName, one listener of a Gateway or ListenerSet, or one rule of a
                  route. They are all of one level, so that what the policy ignores is one
                  thing: Gateways, ListenerSets, routes or Ingresses, each with a sectionName
                  or each without. A target or section not there is no fault: the policy
                  applies to it once it is.
                items:
                  description: |-
                    TargetRef is one object the policy applies to, or one section of it, as
                    Gateway API's LocalPolicyTargetReferenceWithSectionName has it (GEP-713).
                  properties:
                    group:
                      description: Group is the target's API group, gateway.networking.k8s.io, or networking.k8s.io for an Ingress.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: Kind is the target's kind, Gateway, ListenerSet, HTTPRoute, GRPCRoute or Ingress.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the target's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    sectionName:
                      description: |-
                        SectionName is one listener's name, of a Gateway or ListenerSet, or one
                        rule's, of an HTTPRoute or GRPCRoute; left out, the whole object. An
                        Ingress has none.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a target is a Gateway, ListenerSet, HTTPRoute or GRPCRoute of gateway.networking.k8s.io, or an Ingress of networking.k8s.io
                    rule: (self.group == 'gateway.networking.k8s.io' && self.kind in ['Gateway', 'ListenerSet', 'HTTPRoute', 'GRPCRoute']) || (self.group == 'networking.k8s.io' && self.kind == 'Ingress')
                  - message: an Ingress has no sections to name
                    rule: self.kind != 'Ingress' || !has(self.sectionName)
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: targets must all be of one level, Gateways, ListenerSets, routes (HTTPRoutes and GRPCRoutes) or Ingresses
                  rule: 'self.all(target, target.kind == self[0].kind || (target.kind in [''HTTPRoute'', ''GRPCRoute''] && self[0].kind in [''HTTPRoute'', ''GRPCRoute'']))'
                - message: targets must all name a section, or none, as a listener is not its Gateway, nor a rule its route
                  rule: self.all(target, has(target.sectionName) == has(self[0].sectionName))
                - message: each target must be named once
                  rule: 'self.all(a, self.exists_one(b, a.group == b.group && a.kind == b.kind && a.name == b.name && (has(a.sectionName) ? has(b.sectionName) && a.sectionName == b.sectionName : !has(b.sectionName))))'
            required:
            - targetRefs
            type: object
            x-kubernetes-validations:
            - message: a policy holds a limit, a name to ignore, or both
              rule: (has(self.limits) && self.limits.size() > 0) || (has(self.ignore) && self.ignore.size() > 0)
          status:
            description: |-
              Status is what each controller reports of the policy, by ancestor, as Gateway
              API's PolicyStatus has it (GEP-713): for EdgeRush, each DataPlane's Gateway its
              targets reach, and an Ingress it targets.
            properties:
              # Gateway API's PolicyStatus, copied by the test; not to be edited.
              ancestors:
                description: |-
                  Ancestors is a list of ancestor resources (usually Gateways) that are
                  associated with the policy, and the status of the policy with respect to
                  each ancestor. When this policy attaches to a parent, the controller that
                  manages the parent and the ancestors MUST add an entry to this list when
                  the controller first sees the policy and SHOULD update the entry as
                  appropriate when the relevant ancestor is modified.
                  
                  Note that choosing the relevant ancestor is left to the Policy designers;
                  an important part of Policy design is designing the right object level at
                  which to namespace this status.
                  
                  Note also that implementations MUST ONLY populate ancestor status for
                  the Ancestor resources they are responsible for. Implementations MUST
                  use the ControllerName field to uniquely identify the entries in this list
                  that they are responsible for.
                  
                  Note that to achieve this, the list of PolicyAncestorStatus structs
                  MUST be treated as a map with a composite key, made up of the AncestorRef
                  and ControllerName fields combined.
                  
                  A maximum of 16 ancestors will be represented in this list. An empty list
                  means the Policy is not relevant for any ancestors.
                  
                  If this slice is full, implementations MUST NOT add further entries.
                  Instead they MUST consider the policy unimplementable and signal that
                  on any related resources such as the ancestor that would be referenced
                  here. For example, if this list was full on BackendTLSPolicy, no
                  additional Gateways would be able to reference the Service targeted by
                  the BackendTLSPolicy.
                items:
                  description: |-
                    PolicyAncestorStatus describes the status of a route with respect to an
                    associated Ancestor.
                    
                    Ancestors refer to objects that are either the Target of a policy or above it
                    in terms of object hierarchy. For example, if a policy targets a Service, the
                    Policy's Ancestors are, in order, the Service, the HTTPRoute, the Gateway, and
                    the GatewayClass. Almost always, in this hierarchy, the Gateway will be the most
                    useful object to place Policy status on, so we recommend that implementations
                    SHOULD use Gateway as the PolicyAncestorStatus object unless the designers
                    have a _very_ good reason otherwise.
                    
                    In the context of policy attachment, the Ancestor is used to distinguish which
                    resource results in a distinct application of this policy. For example, if a policy
                    targets a Service, it may have a distinct result per attached Gateway.
                    
                    Policies targeting the same resource may have different effects depending on the
                    ancestors of those resources. For example, different Gateways targeting the same
                    Service may have different capabilities, especially if they have different underlying
                    implementations.
                    
                    For example, in BackendTLSPolicy, the Policy attaches to a Service that is
                    used as a backend in a HTTPRoute that is itself attached to a Gateway.
                    In this case, the relevant object for status is the Gateway, and that is the
                    ancestor object referred to in this status.
                    
                    Note that a parent is also an ancestor, so for objects where the parent is the
                    relevant object for status, this struct SHOULD still be used.
                    
                    This struct is intended to be used in a slice that's effectively a map,
                    with a composite key made up of the AncestorRef and the ControllerName.
                  properties:
                    ancestorRef:
                      description: |-
                        AncestorRef corresponds with a ParentRef in the spec that this
                        PolicyAncestorStatus struct describes the status of.
                      properties:
                        group:
                          default: gateway.networking.k8s.io
                          description: |-
                            Group is the group of the referent.
                            When unspecified, "gateway.networking.k8s.io" is inferred.
                            To set the core API group (such as for a "Service" kind referent),
                            Group must be explicitly set to "" (empty string).
                            
                            Support: Core
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          default: Gateway
                          description: |-
                            Kind is kind of the referent.
                            
                            There are two kinds of parent resources with "Core" support:
                            
                            * Gateway (Gateway conformance profile)
                            * Service (Mesh conformance profile, ClusterIP Services only)
                            
                            Support for other resources is Implementation-Specific.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        name:
                          description: |-
                            Name is the name of the referent.
                            
                            Support: Core
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace is the namespace of the referent. When unspecified, this refers
                            to the local namespace of the Route.
                            
                            Note that there are specific rules for ParentRefs which cross namespace
                            boundaries. Cross-namespace references are only valid if they are explicitly
                            allowed by something in the namespace they are referring to. For example:
                            Gateway has the AllowedRoutes field, and ReferenceGrant provides a
                            generic way to enable any other kind of cross-namespace reference.
                            
                            Support: Core
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          description: |-
                            Port is the network port this Route targets. It can be interpreted
                            differently based on the type of parent resource.
                            
                            When the parent resource is a Gateway, this targets all listeners
                            listening on the specified port that also support this kind of Route(and
                            select this Route). It's not recommended to set `Port` unless the
                            networking behaviors specified in a Route must apply to a specific port
                            as opposed to a listener(s) whose port(s) may be changed. When both Port
                            and SectionName are specified, the name and port of the selected listener
                            must match both specified values.
                            
                            Implementations MAY choose to support other parent resources.
                            Implementations supporting other types of parent resources MUST clearly
                            document how/if Port is interpreted.
                            
                            For the purpose of status, an attachment is considered successful as
                            long as the parent resource accepts it partially. For example, Gateway
                            listeners can restrict which Routes can attach to them by Route kind,
                            namespace, or hostname. If 1 of 2 Gateway listeners accept attachment
                            from the referencing Route, the Route MUST be considered successfully
                            attached. If no Gateway listeners accept attachment from this Route,
                            the Route MUST be considered detached from the Gateway.
                            
                            Support: Extended
                          format: int32
                          maximum: 65535.0
                          minimum: 1.0
                          type: integer
                        sectionName:
                          description: |-
                            SectionName is the name of a section within the target resource. In the
                            following resources, SectionName is interpreted as the following:
                            
                            * Gateway: Listener name. When both Port (experimental) and SectionName
                            are specified, the name and port of the selected listener must match
                            both specified values.
                            * Service: Port name. When both Port (experimental) and SectionName
                            are specified, the name and port of the selected listener must match
                            both specified values.
                            
                            Implementations MAY choose to support attaching Routes to other resources.
                            If that is the case, they MUST clearly document how SectionName is
                            interpreted.
                            
                            When unspecified (empty string), this will reference the entire resource.
                            For the purpose of status, an attachment is considered successful if at
                            least one section in the parent resource accepts it. For example, Gateway
                            listeners can restrict which Routes can attach to them by Route kind,
                            namespace, or hostname. If 1 of 2 Gateway listeners accept attachment from
                            the referencing Route, the Route MUST be considered successfully
                            attached. If no Gateway listeners accept attachment from this Route, the
                            Route MUST be considered detached from the Gateway.
                            
                            Support: Core
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - name
                      type: object
                    conditions:
                      description: >-
                        Conditions describes the status of the Policy with respect to the given
                        Ancestor.
                      items:
                        description: >-
                          Condition contains details for one aspect of the current state of this API
                          Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0.0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False, Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: >-
                              ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 8
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    controllerName:
                      description: |-
                        ControllerName is a domain/path string that indicates the name of the
                        controller that wrote this status. This corresponds with the
                        controllerName field on GatewayClass.
                        
                        Example: "example.net/gateway-controller".
                        
                        The format of this field is DOMAIN "/" PATH, where DOMAIN and PATH are
                        valid Kubernetes names
                        (https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names).
                        
                        Controllers MUST populate this field when writing status. Controllers should ensure that
                        entries to status populated with their ControllerName are cleaned up when they are no
                        longer necessary.
                      maxLength: 253
                      minLength: 1
                      pattern: >-
                        ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/[A-Za-z0-9\/\-._~%!$&'()*+,;=:]+$
                      type: string
                  required:
                  - ancestorRef
                  - conditions
                  - controllerName
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              # End of Gateway API's PolicyStatus.
            required:
            - ancestors
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
