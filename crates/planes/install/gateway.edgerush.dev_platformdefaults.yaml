# EdgeRush's PlatformDefaults, as the install ships it. Written by hand: the Rust types are
# written from it (crates/planes/tests/generated.rs), never the other way about.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformdefaults.gateway.edgerush.dev
spec:
  group: gateway.edgerush.dev
  names:
    categories:
    - edgerush
    kind: PlatformDefaults
    listKind: PlatformDefaultsList
    plural: platformdefaults
    singular: platformdefaults
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformDefaults is what the platform allows the cluster's ControlPlanes and
          DataPlanes. There is one, named "default"; without it, each ControlPlane may
          watch its own namespace alone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: Spec is what the platform allows.
            properties:
              watchScopes:
                description: |-
                  WatchScopes is which namespaces ControlPlanes may watch beyond their own,
                  each an allowance for the ControlPlanes it picks. A ControlPlane may use any
                  allowance that picks it; one asking for more than every one of them allows
                  is not accepted, and nothing is made for it. An allowance narrowed takes back
                  what it granted.
                items:
                  description: WatchScope is one allowance.
                  properties:
                    controlPlanes:
                      description: ControlPlanes is which ControlPlanes the allowance is for.
                      properties:
                        namespaceSelector:
                          description: |-
                            NamespaceSelector picks the ControlPlanes of the namespaces whose
                            labels it matches. Every namespace carries its name in the label
                            kubernetes.io/metadata.name, so a list of namespaces is a
                            selector of that label. It must have at least one requirement.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                                x-kubernetes-validations:
                                - message: operator must be In, NotIn, Exists or DoesNotExist
                                  rule: self.operator in ['In', 'NotIn', 'Exists', 'DoesNotExist']
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                          x-kubernetes-validations:
                          - message: a selector must have at least one requirement
                            rule: (has(self.matchLabels) && size(self.matchLabels) > 0) || (has(self.matchExpressions) && size(self.matchExpressions) > 0)
                      required:
                      - namespaceSelector
                      type: object
                    namespaces:
                      description: Namespaces is which namespaces they may watch.
                      properties:
                        from:
                          description: |-
                            From is where the namespaces they may watch are:

                            * All: every namespace in the cluster, so any watch scope.
                            * Selector: those whose labels the selector matches, so a
                              Selector scope whose selector carries every requirement of
                              this one's, and so selects no namespace beyond it.
                          enum:
                          - All
                          - Selector
                          type: string
                        selector:
                          description: |-
                            Selector is the namespaces they may watch where From is "Selector",
                            and must be left out otherwise. It must have at least one requirement:
                            every namespace is From "All".
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                                x-kubernetes-validations:
                                - message: operator must be In, NotIn, Exists or DoesNotExist
                                  rule: self.operator in ['In', 'NotIn', 'Exists', 'DoesNotExist']
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                          x-kubernetes-validations:
                          - message: a selector must have at least one requirement
                            rule: (has(self.matchLabels) && size(self.matchLabels) > 0) || (has(self.matchExpressions) && size(self.matchExpressions) > 0)
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: selector must be given where from is Selector, and only there
                        rule: 'self.from == ''Selector'' ? has(self.selector) : !has(self.selector)'
                  required:
                  - controlPlanes
                  - namespaces
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: there is one PlatformDefaults, named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
