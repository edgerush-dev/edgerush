# A Service written by a control plane holds no externalIPs (docs/05 §2): whoever sets one
# takes that address's traffic, cluster-wide (CVE-2020-8554), and RBAC cannot keep that one
# field from the Service writes edgerush-control-plane-own holds. Every other Service in the
# cluster is left alone. Built into Kubernetes from 1.30; no webhook of EdgeRush's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edgerush-control-plane-services
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  # A policy that cannot be judged refuses: a Service the rule could not be checked on is
  # not let through.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  # A control plane's ServiceAccount, as the operator names them:
  # edgerush-controller-<controlplane>, in the ControlPlane's namespace.
  matchConditions:
    - name: written-by-a-control-plane
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:edgerush-controller-[^:]+$')
  validations:
    - expression: '!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0'
      message: a Service written by an EdgeRush control plane may hold no externalIPs
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edgerush-control-plane-services
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  policyName: edgerush-control-plane-services
  validationActions: [Deny]
---
# Beyond its own namespace a control plane writes only what is its own (docs/05 §2): a
# DataPlane generated for a Gateway lives in the Gateway's namespace, and its control
# plane writes its Service and identity Secret there, under a role its team, able to act
# as its ServiceAccount, holds too. So outside the ServiceAccount's own namespace a Service
# or Secret is created, changed or deleted by it only where the object, and the one it
# replaces, carries its ControlPlane's labels: the control plane's name, as its
# ServiceAccount is named edgerush-controller-<controlplane>, and the namespace that
# ServiceAccount is in. And what it writes is shaped as the control plane writes it, and
# nothing else: a Secret a data plane's identity, kubernetes.io/tls, named
# edgerush-proxy-<dataplane>-identity, never a ServiceAccount's token, which Kubernetes
# would fill for any ServiceAccount of the namespace; a Service the data plane's,
# edgerush-proxy-<dataplane>, never ExternalName, selecting that data plane's pods alone,
# by the labels the operator gives them, never another workload of the namespace. A team
# writing a Gateway of another team's class gives that team no hold on its namespace
# beyond what is made for it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edgerush-control-plane-beyond-its-namespace
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [services, secrets]
  matchConditions:
    - name: written-by-a-control-plane
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:edgerush-controller-[^:]+$')
    - name: beyond-its-namespace
      expression: request.namespace != request.userInfo.username.split(':')[2]
  variables:
    - name: controlPlaneNamespace
      expression: request.userInfo.username.split(':')[2]
    # The name after edgerush-controller-, 20 characters.
    - name: controlPlane
      expression: request.userInfo.username.split(':')[3].substring(20)
    - name: newIsOurs
      expression: >-
        object == null || (has(object.metadata.labels) &&
        'gateway.edgerush.dev/control-plane' in object.metadata.labels && object.metadata.labels['gateway.edgerush.dev/control-plane'] == variables.controlPlane &&
        'gateway.edgerush.dev/control-plane-namespace' in object.metadata.labels && object.metadata.labels['gateway.edgerush.dev/control-plane-namespace'] == variables.controlPlaneNamespace)
    - name: oldIsOurs
      expression: >-
        oldObject == null || (has(oldObject.metadata.labels) &&
        'gateway.edgerush.dev/control-plane' in oldObject.metadata.labels && oldObject.metadata.labels['gateway.edgerush.dev/control-plane'] == variables.controlPlane &&
        'gateway.edgerush.dev/control-plane-namespace' in oldObject.metadata.labels && oldObject.metadata.labels['gateway.edgerush.dev/control-plane-namespace'] == variables.controlPlaneNamespace)
    - name: shapedAsItsOwn
      expression: >-
        object == null ||
        (request.resource.resource == 'secrets' &&
        has(object.type) && object.type == 'kubernetes.io/tls' &&
        object.metadata.name.startsWith('edgerush-proxy-') && object.metadata.name.endsWith('-identity')) ||
        (request.resource.resource == 'services' &&
        (!has(object.spec.type) || object.spec.type != 'ExternalName') &&
        has(object.spec.selector) &&
        'gateway.edgerush.dev/data-plane' in object.spec.selector &&
        object.metadata.name == 'edgerush-proxy-' + object.spec.selector['gateway.edgerush.dev/data-plane'] &&
        'gateway.edgerush.dev/control-plane' in object.spec.selector && object.spec.selector['gateway.edgerush.dev/control-plane'] == variables.controlPlane &&
        'gateway.edgerush.dev/namespace' in object.spec.selector && object.spec.selector['gateway.edgerush.dev/namespace'] == request.namespace &&
        'app.kubernetes.io/component' in object.spec.selector && object.spec.selector['app.kubernetes.io/component'] == 'proxy')
  validations:
    - expression: variables.newIsOurs && variables.oldIsOurs
      message: outside its own namespace, an EdgeRush control plane writes only a Service or Secret labelled with its ControlPlane's name and namespace
      reason: Forbidden
    - expression: variables.shapedAsItsOwn
      message: outside its own namespace, an EdgeRush control plane writes only a data plane's identity Secret, kubernetes.io/tls and named edgerush-proxy-<dataplane>-identity, or its Service, edgerush-proxy-<dataplane>, selecting that data plane's pods alone
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edgerush-control-plane-beyond-its-namespace
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  policyName: edgerush-control-plane-beyond-its-namespace
  validationActions: [Deny]
---
# A DataPlane naming a Gateway (gatewayRef), or a ControlPlane of another namespace, is one
# the operator generates for a Gateway written alone, and the operator's alone to write
# (docs/05 §3): its label, its owner reference to its Gateway and its name can each be
# written by hand, and one written so would be served, for a class the platform gave no
# entry, of whatever spec its writer liked. So whoever is not the operator's ServiceAccount
# makes none, and changes the spec of none, nor turns one into another; what changes their
# metadata alone, a finalizer or an owner reference taken away, is let through. The
# ServiceAccount is named by its namespace too, as operator.yaml installs it: one of its
# name in another namespace is anyone's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edgerush-generated-data-planes
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.edgerush.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [dataplanes]
  matchConditions:
    - name: not-written-by-the-operator
      expression: request.userInfo.username != 'system:serviceaccount:edgerush-system:edgerush-operator'
  variables:
    - name: generated
      expression: >-
        has(object.spec.gatewayRef) ||
        (has(object.spec.controlPlaneRef.namespace) && object.spec.controlPlaneRef.namespace != request.namespace)
    - name: wasGenerated
      expression: >-
        oldObject != null && (has(oldObject.spec.gatewayRef) ||
        (has(oldObject.spec.controlPlaneRef.namespace) && oldObject.spec.controlPlaneRef.namespace != request.namespace))
  validations:
    - expression: '!(variables.generated || variables.wasGenerated) || (oldObject != null && object.spec == oldObject.spec)'
      message: a DataPlane with gatewayRef, or naming a ControlPlane of another namespace, is the operator's to write; it generates one for a Gateway of a class whose PlatformDefaults entry asks for it
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edgerush-generated-data-planes
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  policyName: edgerush-generated-data-planes
  validationActions: [Deny]
