# A Service written by a control plane holds no externalIPs (docs/05 §2): whoever sets one
# takes that address's traffic, cluster-wide (CVE-2020-8554), and RBAC cannot keep that one
# field from the Service writes edgerush-control-plane-own holds. Every other Service in the
# cluster is left alone. Built into Kubernetes from 1.30; no webhook of EdgeRush's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: edgerush-control-plane-services
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  # A policy that cannot be judged refuses: a Service the rule could not be checked on is
  # not let through.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  # A control plane's ServiceAccount, as the operator names them:
  # edgerush-controller-<controlplane>, in the ControlPlane's namespace.
  matchConditions:
    - name: written-by-a-control-plane
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:edgerush-controller-[^:]+$')
  validations:
    - expression: '!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0'
      message: a Service written by an EdgeRush control plane may hold no externalIPs
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: edgerush-control-plane-services
  labels: { app.kubernetes.io/part-of: edgerush }
spec:
  policyName: edgerush-control-plane-services
  validationActions: [Deny]
