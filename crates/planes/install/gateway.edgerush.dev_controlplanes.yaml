# EdgeRush's ControlPlane, as the install ships it. Written by hand: the Rust types are
# written from it (crates/planes/tests/generated.rs), never the other way about.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: controlplanes.gateway.edgerush.dev
spec:
  group: gateway.edgerush.dev
  names:
    categories:
    - edgerush
    kind: ControlPlane
    listKind: ControlPlaneList
    plural: controlplanes
    singular: controlplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ControlPlane is an EdgeRush control plane: a controller that follows a watch scope
          and translates what it finds there for the DataPlanes of its own namespace that name
          it. The operator deploys it, gives it the rights of its scope, and makes the
          GatewayClass named as it is.

          Its name is a DNS label of at most 43 characters, so that its controller's Service,
          `edgerush-controller-<name>`, is a DNS label too. It is unique in the cluster: the
          oldest ControlPlane of a name holds it, and a later one of the same name in another
          namespace is not accepted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: Spec is what the control plane is to be.
            properties:
              authority:
                description: |-
                  Authority is the certificate authority the control plane signs its workloads'
                  certificates with, provided by the platform. Left out, the control plane makes
                  one of its own on first start, in its own namespace.
                properties:
                  secretRef:
                    description: |-
                      SecretRef names a Secret in the ControlPlane's namespace holding the
                      authority's key and certificate, signed by the platform's own root, with
                      the chain up to that root. The control plane signs with it and never
                      writes it: its rotation is the platform's.
                    properties:
                      name:
                        description: Name is the Secret's name.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              rateLimiting:
                description: |-
                  RateLimiting is the control plane's part in its DataPlanes' rate limiting.
                properties:
                  service:
                    description: |-
                      Service is the rate-limiting service the DataPlanes of the control plane
                      share counts through, in either of the modes that share them: present,
                      the operator deploys it in the ControlPlane's namespace; left out, there
                      is none.
                    properties:
                      copies:
                        default: 2
                        description: |-
                          Copies is how many pods keep a copy of each shard beside its owner, as
                          far as there are pods for them: one of them takes the shard over when its
                          owner goes.
                        format: int32
                        minimum: 0
                        type: integer
                      forwarderDecides:
                        default: true
                        description: |-
                          ForwarderDecides is whether a pod a Synchronous data plane asks about a
                          key whose owner it has not heard from for a while decides the key
                          itself, from its copy, rather than forward the ask to an owner it cannot
                          reach: so that an owner gone has its keys held to their limits while a
                          copy takes over, the charges lost if another copy takes them.
                        type: boolean
                      maxKeyBytes:
                        description: |-
                          MaxKeyBytes is what the keys may take in each pod's memory: past it,
                          keys are evicted, and start again full. Three quarters of the pods'
                          memory limit unless said, and with no memory limit 268,435,456 (256 MiB).
                        format: int64
                        minimum: 1
                        type: integer
                      replicas:
                        default: 3
                        description: |-
                          Replicas is how many pods run. Three is the fewest that go on serving
                          with one of them lost.
                        format: int32
                        minimum: 1
                        type: integer
                      resources:
                        description: Resources is each pod's compute resources.
                        properties:
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits is the most of each resource a pod may use.
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests is how much of each resource a pod is given.
                            type: object
                        type: object
                      shards:
                        default: 256
                        description: |-
                          Shards is how many shards the keys are split into, fixed while the
                          service is declared: a pod of another number would not join the others.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                        x-kubernetes-validations:
                        - message: shards is fixed while the service is declared
                          rule: self == oldSelf
                    type: object
                type: object
              replicas:
                default: 1
                description: |-
                  Replicas is how many controllers run. One leads, elected by a Lease; the
                  others stand by to take over.
                format: int32
                minimum: 1
                type: integer
              watch:
                default: {}
                description: Watch is where the control plane follows Ingresses, routes and what they name.
                properties:
                  namespaces:
                    default:
                      from: Same
                    description: |-
                      Namespaces is which namespaces the control plane watches. Beyond its own,
                      the platform's allowance bounds them: a ControlPlane asking for more is not
                      accepted.
                    properties:
                      from:
                        default: Same
                        description: |-
                          From is where the namespaces watched are:

                          * Same: the ControlPlane's own namespace alone.
                          * Selector: those whose labels the selector matches.
                          * All: every namespace in the cluster.
                        enum:
                        - All
                        - Selector
                        - Same
                        type: string
                      selector:
                        description: |-
                          Selector is the namespaces watched where From is "Selector", and
                          must be left out otherwise.
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label selector
                              requirements. The requirements are ANDed.
                            items:
                              description: |-
                                A label selector requirement is a selector that contains values, a key, and an operator that
                                relates the key and values.
                              properties:
                                key:
                                  description: key is the label key that the selector
                                    applies to.
                                  type: string
                                operator:
                                  description: |-
                                    operator represents a key's relationship to a set of values.
                                    Valid operators are In, NotIn, Exists and DoesNotExist.
                                  type: string
                                values:
                                  description: |-
                                    values is an array of string values. If the operator is In or NotIn,
                                    the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - key
                              - operator
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: |-
                              matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions, whose key field is "key", the
                              operator is "In", and the values array contains only "value". The requirements are ANDed.
                            type: object
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                    x-kubernetes-validations:
                    - message: selector must be given where from is Selector, and only there
                      rule: 'self.from == ''Selector'' ? has(self.selector) : !has(self.selector)'
                type: object
              webhook:
                default: {}
                description: Webhook is the control plane's admission webhook, which judges an Ingress or a RateLimitPolicy as it is written.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled registers the webhook. Off, an Ingress or a RateLimitPolicy is
                      judged only in its status: for a platform that keeps admission webhooks to
                      its own, or a team that would rather read status alone.
                    type: boolean
                type: object
            type: object
          status:
            description: Status is what the operator and the control plane report of it.
            properties:
              authority:
                description: |-
                  Authority is the control plane's certificate authority, as its leader
                  publishes it, under a field manager of its own: what the operator registers
                  its webhook with.
                properties:
                  bundle:
                    description: |-
                      Bundle is the certificates, PEM, that its own certificate is trusted by:
                      its authority's, and while a provided one is replaced the one before
                      too, as each of its workloads is given them.
                    maxLength: 65536
                    type: string
                type: object
              conditions:
                description: |-
                  Conditions describe the ControlPlane's state. Known condition types are:

                  * "Accepted": whether the operator accepted it, by the checks only the
                    cluster can make; what the control plane acts on.
                  * "Programmed": whether what it asks for is made, and its workload has a
                    replica available.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              rateLimiting:
                description: RateLimiting is what the control plane keeps of its rate-limiting service.
                properties:
                  naming:
                    description: |-
                      Naming is the control plane's last naming of the service's pods to form
                      its cluster, which its leader writes before it tells any pod, in place of
                      the one before: kept across the controller's restarts, so that a new
                      leader goes on from it, and dropped with the service.
                    properties:
                      generation:
                        description: Generation is the cluster's generation named.
                        format: int64
                        minimum: 1
                        type: integer
                      latest:
                        description: |-
                          Latest is the latest table any of the pods named held then, by its term
                          and version: the one the cluster forms from.
                        properties:
                          term:
                            description: Term is the table's term.
                            format: int64
                            minimum: 0
                            type: integer
                          version:
                            description: Version is the table's version in its term.
                            format: int64
                            minimum: 0
                            type: integer
                        required:
                        - term
                        - version
                        type: object
                      named:
                        description: Named is the pods named to form it.
                        items:
                          description: A pod named, as it answered the control plane.
                          properties:
                            address:
                              description: Address is where the other pods reach it, host:port.
                              minLength: 1
                              type: string
                            member:
                              description: |-
                                Member is its member id, a new one each time the pod starts, in
                                decimal as the pod's log has it: a string, as an id of 64 bits is
                                rounded by a tool that reads every number as a JavaScript one.
                              maxLength: 20
                              pattern: ^(0|[1-9][0-9]*)$
                              type: string
                          required:
                          - address
                          - member
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - generation
                    - latest
                    - named
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: the name of a ControlPlane must be a DNS label of at most 43 lower-case letters, digits and '-', starting and ending with a letter or digit, as its controller's Service, edgerush-controller-<name>, is a DNS label
          rule: size(self.metadata.name) <= 43 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
